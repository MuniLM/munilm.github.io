              <div class="gantt-cell gantt-hdr-cell" style="grid-column:1 / -1; background:#F1F5F9; display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <span>MUNILM LAUNCH SCHEDULE</span>
                <button type="button" class="row-icon-btn no-print"
                        onclick="window.toggleMetaCols()"
                        title="${ui.hideMetaCols ? "Expand Member, Start, End &amp; % Done columns" : "Collapse Member, Start, End &amp; % Done columns for a clean Tasks &amp; Subtasks view"}"
                        style="font-size:10px; padding:2px 8px; border-color:var(--muni-border-strong);">
                  ${ui.hideMetaCols ? "&#9654; Show Member / Dates / %" : "&#9664; Hide Member / Dates / %"}
                </button>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(${totalDays}, 1fr); background:#F1F5F9;">
              ${weeks.map(w => `
                <div style="grid-column:span ${w.span}; padding:5px 4px; text-align:center; font-size:9.5px; font-weight:800; letter-spacing:0.05em; color:var(--muni-charcoal); border-left:1px solid rgba(20,21,25,0.10); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
                  ${esc(w.label)}
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Tier 2 Header: Column Titles + Daily Cells -->
          <div class="gantt-hdr-days" style="grid-template-columns:${gridTemplate}; border-bottom:1.5px solid var(--muni-border-strong);">
            <div class="gantt-left-cols" style="background:#F8FAFC;">
              <div class="gantt-cell gantt-hdr-cell" style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <span>Task &amp; Connected Subtasks</span>
                <span style="font-size:9px; color:var(--muni-muted); font-weight:700;">&#8596; Drag Edge</span>
                <div class="col-resize-grip no-print"
                     title="Drag horizontally to expand or shrink column (double-click to reset)"
                     onmousedown="window.startTaskColResize(event)"
                     ondblclick="window.resetTaskColWidth()"></div>
              </div>
              <div class="gantt-cell gantt-hdr-cell gantt-meta-cell">Member</div>
              <div class="gantt-cell gantt-hdr-cell gantt-meta-cell">Start</div>
              <div class="gantt-cell gantt-hdr-cell gantt-meta-cell">End</div>
              <div class="gantt-cell gantt-hdr-cell gantt-meta-cell">% Done</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(${totalDays}, 1fr); background:#F8FAFC;">
              ${days.map(d => `
                <div style="padding:4px 1px; text-align:center; border-right:1px solid rgba(20,21,25,0.045); ${d.isMonday ? "border-left:1px solid rgba(20,21,25,0.11);" : ""} background:${d.isToday ? "rgba(240,83,50,0.14)" : (d.isWeekend ? "#EEF2F6" : "transparent")};"
                     title="${escAttr(d.iso)}">
                  ${!denseDays ? `<div style="font-size:8.5px; font-weight:700; color:${d.isToday ? "var(--muni-orange)" : "var(--muni-muted)"};">${esc(d.weekdayNarrow)}</div>` : ""}
                  <div style="font-size:${denseDays ? "9px" : "10.5px"}; font-weight:800; color:${d.isToday ? "var(--muni-orange)" : "var(--muni-ink)"};">${ denseDays && !d.isMonday && !d.isToday ? "" : d.dayNum }</div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Body Sections, Collapsible Tasks & Draggable Bars -->
          <div>${sectionsHtml}</div>
        </div>
      </div>
    `;
  }

  // --- Horizontal Drag Resizer for Task & Connected Subtasks Column ---
  window.startTaskColResize = function(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    const wrap = document.getElementById("ganttWrapRoot");
    if (!wrap) return;
    const startX = ev.clientX;
    const initW = ui.taskColWidth || DEFAULT_TASK_COL_WIDTH;
    wrap.classList.add("resizing-col");
    document.body.style.cursor = "col-resize";

    const onMove = (me) => {
      const nextW = Math.max(MIN_TASK_COL_WIDTH, Math.min(MAX_TASK_COL_WIDTH, Math.round(initW + (me.clientX - startX))));
      ui.taskColWidth = nextW;
      wrap.style.setProperty("--task-col-w", nextW + "px");
    };

    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      wrap.classList.remove("resizing-col");
      document.body.style.cursor = "";
      saveUiPrefs();
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  window.resetTaskColWidth = function() {
    ui.taskColWidth = DEFAULT_TASK_COL_WIDTH;
    const wrap = document.getElementById("ganttWrapRoot");
    if (wrap) wrap.style.setProperty("--task-col-w", DEFAULT_TASK_COL_WIDTH + "px");
    saveUiPrefs();
  };

  // --- Live Inline Preview Helpers (Zero Re-render Lag While Typing/Dragging) ---
  window.livePreviewTaskTitle = function(taskId, val, pct) {
    const lbl = document.getElementById("gantt-bar-lbl-" + taskId);
    if (lbl) lbl.textContent = `${val} (${pct}%)`;
  };

  window.livePreviewSubtaskTitle = function(subId, val) {
    const numEl = document.getElementById("pct-num-" + subId);
    const pct = numEl ? numEl.value : 0;
    const lbl = document.getElementById("gantt-bar-lbl-" + subId);
    if (lbl) lbl.textContent = `↳ ${val} (${pct}%)`;
  };

  window.livePreviewPct = function(id, val, colorHex, isSub) {
    const n = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
    const numEl = document.getElementById("pct-num-" + id);
    if (numEl) numEl.value = String(n);
    const fillEl = document.getElementById("gantt-fill-" + id);
    if (fillEl) fillEl.style.width = n + "%";
    const slider = document.getElementById((isSub ? "sub-slider-" : "task-slider-") + id);
    if (slider) {
      const c = n >= 80 ? "#0F9D58" : (colorHex || "#2563EB");
      slider.style.background = `linear-gradient(to right, ${c} ${n}%, #E2E8F0 ${n}%)`;
    }
    const titleInp = document.getElementById((isSub ? "sub-title-inp-" : "task-title-inp-") + id);
    const lbl = document.getElementById("gantt-bar-lbl-" + id);
    if (lbl && titleInp) {
      lbl.textContent = isSub ? `↳ ${titleInp.value} (${n}%)` : `${titleInp.value} (${n}%)`;
    }

    // Live-preview parent task & phase % rollup while dragging
    let parentTask = null;
    if (isSub) {
      parentTask = (appState.tasks || []).find(t => (t.subtasks || []).some(s => s.id === id));
      if (parentTask) {
        const subs = parentTask.subtasks || [];
        const pPct = Math.round(
          subs.reduce((s, st) => s + (st.id === id ? n : (st.progress_pct || 0)), 0) / Math.max(1, subs.length)
        );
        const pNum = document.getElementById("pct-num-" + parentTask.id);
        if (pNum) pNum.textContent = pPct + "%";
        const pAutoFill = document.getElementById("task-auto-fill-" + parentTask.id);
        if (pAutoFill) {
          pAutoFill.style.width = pPct + "%";
          pAutoFill.style.background = pPct >= 80 ? "#0F9D58" : "#2563EB";
        }
        const pBarFill = document.getElementById("gantt-fill-" + parentTask.id);
        if (pBarFill) pBarFill.style.width = pPct + "%";
        const pBarLbl = document.getElementById("gantt-bar-lbl-" + parentTask.id);
        if (pBarLbl) pBarLbl.textContent = `${parentTask.title} (${pPct}%)`;
      }
    } else {
      parentTask = (appState.tasks || []).find(t => t.id === id) || null;
    }

    if (parentTask) {
      const secId = parentTask.section_id;
      const secTasks = (appState.tasks || []).filter(t => t.section_id === secId && taskMatchesFilters(t));
      if (secTasks.length > 0) {
        const secPct = Math.round(
          secTasks.reduce((sum, t) => {
            if (t.id === parentTask.id) {
              if (isSub) {
                const subs = t.subtasks || [];
                return sum + Math.round(subs.reduce((a, st) => a + (st.id === id ? n : (st.progress_pct || 0)), 0) / Math.max(1, subs.length));
              }
              return sum + n;
            }
            return sum + (t.progress_pct || 0);
          }, 0) / secTasks.length
        );
        const sLbl = document.getElementById("sec-pct-lbl-" + secId);
        if (sLbl) sLbl.textContent = secPct + "%";
        const sFill = document.getElementById("gantt-sec-fill-" + secId);
        if (sFill) sFill.style.width = secPct + "%";
      }
    }
  };

  // --- VIEW 2: Sortable & Inline-Editable Table View (with Collapsible Subtasks) ---
  function renderTableView(filteredTasks, todayIso) {
    const sorted = [...filteredTasks];
    const dir = ui.tableSortDir === "desc" ? -1 : 1;
    const statusOrd = { Todo: 1, Doing: 2, Stuck: 3, Done: 4 };
    sorted.sort((a, b) => {
      const ma = computeTaskMetrics(a, todayIso);
      const mb = computeTaskMetrics(b, todayIso);
      const f = ui.tableSortField;
      if (f === "title") return dir * a.title.localeCompare(b.title);
      if (f === "phase") return dir * getSection(a.section_id).title.localeCompare(getSection(b.section_id).title);
      if (f === "owner") return dir * getMember(a.owner).name.localeCompare(getMember(b.owner).name);
      if (f === "priority") return dir * ((a.priority || 3) - (b.priority || 3));
      if (f === "progress") return dir * (ma.pct - mb.pct);
      if (f === "status") return dir * ((statusOrd[a.status] || 9) - (statusOrd[b.status] || 9));
      if (f === "end_date") return dir * (a.end_date || "").localeCompare(b.end_date || "");
      return dir * (a.start_date || "").localeCompare(b.start_date || "");
    });

    const arrow = (f) => ui.tableSortField === f ? (ui.tableSortDir === "asc" ? " &uarr;" : " &darr;") : "";
    const members = appState.team_members || [];
    const sections = appState.sections || [];

    return `
      <div class="table-wrap">
        <table class="muni-tbl">
          <thead>
            <tr>
              <th style="width:36%;" onclick="window.sortLaunchTable('title')">Task &amp; Subtasks${arrow("title")}</th>
              <th onclick="window.sortLaunchTable('phase')">Phase${arrow("phase")}</th>
              <th onclick="window.sortLaunchTable('owner')">Member${arrow("owner")}</th>
              <th onclick="window.sortLaunchTable('priority')">Priority${arrow("priority")}</th>
              <th onclick="window.sortLaunchTable('progress')">% Complete${arrow("progress")}</th>
              <th onclick="window.sortLaunchTable('status')">Status${arrow("status")}</th>
              <th onclick="window.sortLaunchTable('start_date')">Start Date${arrow("start_date")}</th>
              <th onclick="window.sortLaunchTable('end_date')">End Date${arrow("end_date")}</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map(t => {
              const m = computeTaskMetrics(t, todayIso);
              const sec = getSection(t.section_id);
              const stStyle = STATUS_STYLE[t.status] || STATUS_STYLE.Todo;
              const tIdJs = escJs(t.id);
              const subs = t.subtasks || [];
              const taskCollapsed = Boolean(ui.collapsedTasks[t.id]);

              const subRowsHtml = taskCollapsed ? "" : subs.map(st => {
                normalizeSubtask(st, t);
                const stIdJs = escJs(st.id);
                const sPct = st.progress_pct;
                return `
                  <tr class="tbl-sub-row">
                    <td style="padding-left:38px;">
                      <div style="display:flex; align-items:center; gap:6px;">
                        <span style="color:var(--muni-orange); font-weight:800; font-size:10.5px;">&#9584;&#9472;&#9658;</span>
                        <input type="checkbox" ${sPct >= 100 ? "checked" : ""}
                               onchange="window.toggleSubtaskDone('${tIdJs}', '${stIdJs}', this.checked)"
                               style="accent-color:var(--muni-orange); cursor:pointer;" />
                        <input type="text" class="inline-text-inp sub ${sPct >= 100 ? "done-strike" : ""}"
                               value="${escAttr(st.title)}"
                               onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'title', this.value)" />
                        <button type="button" class="row-icon-btn" style="color:var(--fail-red);" onclick="window.deleteSubtaskInline('${tIdJs}', '${stIdJs}')" title="Delete subtask">&#10005;</button>
                      </div>
                    </td>
                    <td><span style="font-size:10.5px; color:var(--muni-muted);">Subtask</span></td>
                    <td>
                      <select class="sel" style="padding:3px 7px; font-size:11px; font-weight:700;"
                              onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'owner', this.value)">
                        ${members.map(mem => `<option value="${escAttr(mem.id)}" ${mem.id === (st.owner || t.owner) ? "selected" : ""}>${esc(mem.name)}</option>`).join("")}
                      </select>
                    </td>
                    <td><span style="color:var(--muni-muted); font-size:11px;">—</span></td>
                    <td>
                      <div style="display:flex; align-items:center; gap:5px;">
                        <input type="range" min="0" max="100" step="5" value="${sPct}" class="prog-slider"
                               style="background:linear-gradient(to right, ${sPct >= 80 ? "#0F9D58" : "#2563EB"} ${sPct}%, #E2E8F0 ${sPct}%);"
                               onchange="window.setSubtaskProgress('${tIdJs}', '${stIdJs}', this.value)" />
                        <input type="number" min="0" max="100" value="${sPct}" class="inline-pct-num"
                               onchange="window.setSubtaskProgress('${tIdJs}', '${stIdJs}', this.value)" />
                        <span style="font-size:10.5px; color:var(--muni-muted);">%</span>
                      </div>
                    </td>
                    <td><span style="font-size:11px; font-weight:700; color:${sPct >= 100 ? "var(--pass-green)" : "var(--muni-muted)"};">${sPct >= 100 ? "Done" : (sPct > 0 ? "Doing" : "Todo")}</span></td>
                    <td><input type="date" class="inp mono-num" style="padding:3px 6px; font-size:11px;" value="${escAttr(st.start_date)}" onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'start_date', this.value)" /></td>
                    <td><input type="date" class="inp mono-num" style="padding:3px 6px; font-size:11px;" value="${escAttr(st.end_date)}" onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'end_date', this.value)" /></td>
                  </tr>
                `;
              }).join("");

              return `
                <tr class="tbl-row">
                  <td>
                    <div style="display:flex; align-items:center; gap:6px;">
                      ${subs.length > 0 ? `
                        <button type="button" class="collapse-btn" onclick="window.toggleTaskCollapse('${tIdJs}', event)">${taskCollapsed ? "&#9656;" : "&#9662;"}</button>
                      ` : `<span style="width:18px; flex-shrink:0;"></span>`}
                      <span onclick="window.toggleStarTask('${tIdJs}', event)" style="cursor:pointer; color:${t.starred ? "var(--muni-orange)" : "#CBD5E1"};">${t.starred ? "&#9733;" : "&#9734;"}</span>
                      <input type="text" class="inline-text-inp ${m.isDone ? "done-strike" : ""}"
                             value="${escAttr(t.title)}"
                             onchange="window.updateTaskField('${tIdJs}', 'title', this.value)" />
                      ${subs.length ? `<span style="font-size:10px; font-weight:800; padding:1px 6px; border-radius:6px; background:#F1F5F9; color:#334155;">&#8627;${subs.length}</span>` : ""}
                      <button type="button" class="row-icon-btn" style="color:var(--muni-orange);" onclick="window.addInlineSubtask('${tIdJs}', event)" title="Add subtask">+&#8627;</button>
                      <button type="button" class="row-icon-btn" onclick="window.openTaskDrawer('${tIdJs}')" title="Open full drawer">&#8599;</button>
                    </div>
                  </td>
                  <td>
                    <select class="sel" style="padding:3px 7px; font-size:11px; font-weight:700; background:${escAttr(sec.bg)}; color:${escAttr(sec.color)}; border:none;"
                            onchange="window.updateTaskField('${tIdJs}', 'section_id', this.value)">
                      ${sections.map(s => `<option value="${escAttr(s.id)}" ${s.id === t.section_id ? "selected" : ""}>${esc(s.code)}</option>`).join("")}
                    </select>
                  </td>
                  <td>
                    <select class="sel" style="padding:4px 8px; font-size:11.5px; font-weight:700;"
                            onchange="window.updateTaskField('${tIdJs}', 'owner', this.value)">
                      ${members.map(mem => `<option value="${escAttr(mem.id)}" ${mem.id === t.owner ? "selected" : ""}>${esc(mem.name)}</option>`).join("")}
                    </select>
                  </td>
                  <td>
                    <div style="display:inline-flex; gap:2px;">
                      ${[1, 2, 3, 4, 5].map(n => `
                        <span onclick="window.updateTaskField('${tIdJs}', 'priority', ${n})"
                              style="cursor:pointer; font-size:13px; color:${n <= t.priority ? "#F59E0B" : "#CBD5E1"};">&#9733;</span>
                      `).join("")}
                    </div>
                  </td>
                  <td>
                    ${subs.length > 0 ? `
                      <div style="display:flex; align-items:center; gap:6px;" title="Auto-calculated from ${subs.length} subtask(s)">
                        <div style="width:52px; height:6px; border-radius:999px; background:#E2E8F0; overflow:hidden;">
                          <div style="width:${m.pct}%; height:100%; background:${m.pct >= 80 ? "#0F9D58" : "#2563EB"};"></div>
                        </div>
                        <span class="mono-num">${m.pct}%</span>
                        <span style="font-size:9.5px; font-weight:700; color:var(--muni-muted);">auto</span>
                      </div>
                    ` : `
                      <div style="display:flex; align-items:center; gap:5px;">
                        <input type="range" min="0" max="100" step="5" value="${m.pct}" class="prog-slider"
                               style="background:linear-gradient(to right, ${m.pct >= 80 ? "#0F9D58" : "#2563EB"} ${m.pct}%, #E2E8F0 ${m.pct}%);"
                               onchange="window.setTaskProgress('${tIdJs}', this.value)" />
                        <input type="number" min="0" max="100" value="${m.pct}" class="inline-pct-num"
                               onchange="window.setTaskProgress('${tIdJs}', this.value)" />
                        <span style="font-size:10.5px; color:var(--muni-muted);">%</span>
                      </div>
                    `}
                  </td>
                  <td>
                    <select class="sel" style="padding:4px 8px; font-size:11.5px; font-weight:800; background:${stStyle.bg}; color:${stStyle.color}; border:none;"
                            onchange="window.setTaskStatus('${tIdJs}', this.value)">
                      ${STATUS_LIST.map(st => `<option value="${st}" ${st === t.status ? "selected" : ""}>${st}</option>`).join("")}
                    </select>
                  </td>
                  <td><input type="date" class="inp mono-num" style="padding:3px 6px; font-size:11px;" value="${escAttr(t.start_date)}" onchange="window.updateTaskField('${tIdJs}', 'start_date', this.value)" /></td>
                  <td><input type="date" class="inp mono-num" style="padding:3px 6px; font-size:11px; ${m.isOverdue ? "border-color:var(--fail-red); color:var(--fail-red);" : ""}" value="${escAttr(t.end_date)}" onchange="window.updateTaskField('${tIdJs}', 'end_date', this.value)" /></td>
                </tr>
                ${subRowsHtml}
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  // --- VIEW 3: Drag-and-Drop Kanban Board ---
  function renderKanbanView(filteredTasks, todayIso) {
    return `
      <div class="kanban-grid">
        ${STATUS_LIST.map(col => {
          const colTasks = filteredTasks.filter(t => t.status === col);
          const stStyle = STATUS_STYLE[col];
          return `
            <div class="kanban-col"
                 ondragover="event.preventDefault(); this.classList.add('drag-over');"
                 ondragleave="this.classList.remove('drag-over');"
                 ondrop="this.classList.remove('drag-over'); window.onKanbanDrop('${col}')">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:8px; background:${stStyle.bg}; color:${stStyle.color};">${col}</span>
                <span class="mono-num" style="color:var(--muni-muted);">${colTasks.length}</span>
              </div>
              ${colTasks.map(t => {
                const m = computeTaskMetrics(t, todayIso);
                const sec = getSection(t.section_id);
                const mem = getMember(t.owner);
                const tIdJs = escJs(t.id);
                return `
                  <div class="kanban-card" draggable="true"

  // --- Interactive Phase Bar Drag & Edge-Resize ---
  window.startPhaseGanttDrag = function(ev, secId, mode, initStartIdx, initEndIdx) {
    ev.stopPropagation();
    ev.preventDefault();
    const days = window._launchTimelineDays || [];
    const total = days.length;
    if (!total) return;

    const barEl = document.getElementById("gantt-sec-bar-" + secId);
    if (!barEl) return;
    const trackEl = barEl.closest(".gantt-track");
    if (!trackEl) return;

    const rect = trackEl.getBoundingClientRect();
    const dayIdxAt = (clientX) => {
      const rel = clientX - rect.left;
      return Math.max(0, Math.min(total - 1, Math.floor((rel / Math.max(1, rect.width)) * total)));
    };

    const grabIdx = dayIdxAt(ev.clientX);
    const span = Math.max(0, initEndIdx - initStartIdx);
    let curS = initStartIdx;
    let curE = initEndIdx;
    let moved = false;

    barEl.style.boxShadow = "0 6px 16px rgba(20, 21, 25, 0.20)";
    barEl.style.zIndex = "15";

    const onMove = (me) => {
      const idx = dayIdxAt(me.clientX);
      if (mode === "LEFT") {
        curS = Math.min(idx, curE);
      } else if (mode === "RIGHT") {
        curE = Math.max(idx, curS);
      } else {
        const delta = idx - grabIdx;
        curS = Math.max(0, Math.min(total - 1 - span, initStartIdx + delta));
        curE = curS + span;
      }
      moved = true;
      const leftPct = (curS / total) * 100;
      const widthPct = Math.max(100 / total, ((curE - curS + 1) / total) * 100);
      barEl.style.left = `calc(${leftPct}% + 2px)`;
      barEl.style.width = `calc(${widthPct}% - 4px)`;
      const sInp = document.getElementById("gantt-sec-start-" + secId);
      const eInp = document.getElementById("gantt-sec-end-" + secId);
      if (sInp && days[curS]) sInp.value = days[curS].iso;
      if (eInp && days[curE]) eInp.value = days[curE].iso;
    };

    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      barEl.style.boxShadow = "";
      barEl.style.zIndex = "5";
      if (!moved || !days[curS] || !days[curE]) return;
      const sec = (appState.sections || []).find(s => s.id === secId);
      if (!sec) return;
      sec.start_date = days[curS].iso;
      sec.end_date = days[curE].iso;
      scheduleSaveState("Updated phase schedule");
      renderApp();
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  window.updatePhaseDate = function(secId, field, value) {
    const sec = (appState.sections || []).find(s => s.id === secId);
    if (!sec || !value) return;
    normalizeSection(sec, appState.tasks || []);
    sec[field] = value;
    if (field === "start_date" && sec.end_date < sec.start_date) sec.end_date = sec.start_date;
    if (field === "end_date" && sec.end_date < sec.start_date) sec.start_date = sec.end_date;
    scheduleSaveState("Updated phase dates");
    renderApp();
  };

    const grabIdx = dayIdxAt(ev.clientX);

    const onMove = (me) => {
      const idx = dayIdxAt(me.clientX);
      if (mode === "LEFT") {
        curS = Math.min(idx, curE);
      } else if (mode === "RIGHT") {
        curE = Math.max(idx, curS);
      } else {
        const delta = idx - grabIdx;
        curS = Math.max(0, Math.min(total - 1 - span, initStartIdx + delta));
        curE = curS + span;
      }
      moved = true;
      const leftPct = (curS / total) * 100;
      const widthPct = Math.max(100 / total, ((curE - curS + 1) / total) * 100);

      const eInp = document.getElementById("gantt-end-" + domId);
      if (sInp && days[curS]) sInp.value = days[curS].iso;
      if (eInp && days[curE]) eInp.value = days[curE].iso;
    };

    const onUp = () => {
      window.removeEventListener("mousemove", onMove);

  window.setTaskProgress = function(taskId, val) {
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t || (t.subtasks && t.subtasks.length > 0)) return;
    const n = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
    t.progress_pct = n;
    if (n === 100) t.status = "Done";
    else if (n > 0 && t.status === "Todo") t.status = "Doing";
    else if (n < 100 && t.status === "Done") t.status = "Doing";
    scheduleSaveState();
    renderApp();
  };

  window.setTaskStatus = function(taskId, statusVal) {
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t || !STATUS_LIST.includes(statusVal)) return;
    t.status = statusVal;
    if (t.subtasks && t.subtasks.length > 0) {
      if (statusVal === "Done") {
        t.subtasks.forEach(s => { s.progress_pct = 100; s.done = true; });
      } else if (statusVal === "Todo") {
        t.subtasks.forEach(s => { s.progress_pct = 0; s.done = false; });
      }
      normalizeTask(t);
    } else {
      if (statusVal === "Done") t.progress_pct = 100;
      else if (statusVal === "Todo" && t.progress_pct === 100) t.progress_pct = 0;
      else if (statusVal === "Doing" && t.progress_pct === 0) t.progress_pct = 25;
    }
    scheduleSaveState();
    renderApp();
  };

  function syncDrawerInputsIntoTask(t) {
    const titleVal = (document.getElementById("drwTitle")?.value || "").trim();
    if (titleVal) t.title = titleVal;
    t.section_id = document.getElementById("drwSection")?.value || t.section_id;
    t.owner = document.getElementById("drwOwner")?.value || t.owner;
    t.status = document.getElementById("drwStatus")?.value || t.status;
    t.priority = parseInt(document.getElementById("drwPriority")?.value || "4", 10);
    t.progress_pct = parseInt(document.getElementById("drwPct")?.value || "0", 10);
    t.start_date = document.getElementById("drwStart")?.value || t.start_date;
    t.end_date = document.getElementById("drwEnd")?.value || t.start_date;
    if (t.end_date < t.start_date) t.end_date = t.start_date;
    t.deliverable = document.getElementById("drwDeliverable")?.value || "";
    if (t.status === "Done") t.progress_pct = 100;
    normalizeTask(t);

    const sEl = document.getElementById("drwStart");
    const eEl = document.getElementById("drwEnd");
    if (sEl) sEl.value = addDaysIso(sEl.value, delta);
    if (eEl) eEl.value = addDaysIso(eEl.value, delta);
  };

  window.addDrawerSubtask = function() {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    const inp = document.getElementById("drawerNewSubTitle");
    const subTitle = (inp?.value || "").trim();
    if (!subTitle) { if (inp) inp.focus(); return; }
    t.subtasks.push(normalizeSubtask({
      id: "sub_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
      title: subTitle,
      owner: t.owner,
      start_date: t.start_date,
      end_date: t.end_date,
      progress_pct: 0,
      done: false
    }, t));
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.editDrawerSubtask = function(subId, field, val) {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    const st = (t.subtasks || []).find(s => s.id === subId);
    if (!st) return;
    if (field === "done") {
      st.progress_pct = val ? 100 : 0;
      st.done = Boolean(val);
    } else if (field === "progress_pct") {
      st.progress_pct = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
      st.done = st.progress_pct >= 100;
    } else {
      st[field] = val;
    }
    normalizeSubtask(st, t);
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.deleteDrawerSubtask = function(subId) {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    t.subtasks = (t.subtasks || []).filter(s => s.id !== subId);
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.saveTaskDrawer = function() {
    const t = getDrawerTargetTask();
    if (!t) return;
    const rawTitle = (document.getElementById("drwTitle")?.value || "").trim();
    if (!rawTitle) {
      document.getElementById("drwTitle")?.focus();
      return;
    }
    syncDrawerInputsIntoTask(t);
    if (t._isDraftNew) {
      delete t._isDraftNew;
      appState.tasks.push(t);
      window._draftDrawerTask = null;
    }
    window.closeTaskDrawer();
    scheduleSaveState("Saved task");
    renderApp();
  };

    const t = getDrawerTargetTask();
    if (!t || t._isDraftNew) return;
    syncDrawerInputsIntoTask(t);
    const copy = deepClone(t);
    copy.id = "tsk_" + Date.now().toString(36) + "_cp";
    copy.title = t.title + " (Copy)";
    copy.subtasks = (copy.subtasks || []).map((s, i) => ({ ...s, id: copy.id + "_s" + i }));

    scheduleSaveState("Duplicated task");

  // --- Zero-Dependency Native OpenXML (.xlsx) Builder + JSON/XLSX Sync ---
  const CRC_TABLE = (function() {
    const tbl = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      tbl[n] = c >>> 0;
    }
    return tbl;
  })();

  function crc32Bytes(u8) {
    let crc = 0 ^ (-1);
    for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ u8[i]) & 0xFF];
    return (crc ^ (-1)) >>> 0;
  }

  function buildStoredZip(files) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const dataBytes = f.data instanceof Uint8Array ? f.data : enc.encode(f.data);
      const crc = crc32Bytes(dataBytes);
      const sz = dataBytes.length;

      const lh = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0x5778, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, sz, true);
      lv.setUint32(22, sz, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);

      localParts.push(lh, dataBytes);

      const ch = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x5778, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, sz, true);
      cv.setUint32(24, sz, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      centralParts.push(ch);

      offset += lh.length + sz;
    }

    const centralSize = centralParts.reduce((s, p) => s + p.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    const totalLen = offset + centralSize + 22;
    const out = new Uint8Array(totalLen);
    let pos = 0;
    for (const p of localParts) { out.set(p, pos); pos += p.length; }
    for (const p of centralParts) { out.set(p, pos); pos += p.length; }
    out.set(eocd, pos);
    return out;
  }

  function colLetter(colIdx1) {
    let n = colIdx1;
    let s = "";
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function xmlEsc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function isoToExcelSerial(iso) {
    const p = parseIsoDate(iso);
    if (!p) return null;
    const utcMs = Date.UTC(p.getFullYear(), p.getMonth(), p.getDate());
    const epochMs = Date.UTC(1899, 11, 30);
    return Math.round((utcMs - epochMs) / 86400000);
  }

  function excelSerialToIso(serial) {
    const n = Number(serial);
    if (!Number.isFinite(n) || n < 20000 || n > 80000) return "";
    const dt = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
    return dt.toISOString().slice(0, 10);
  }

  function generateMuniLmXlsxBytes() {
    const todayIso = todayIsoStr();
    const allTasks = appState.tasks || [];
    let minIso = todayIso;
    let maxIso = addDaysIso(todayIso, 42);
    if (allTasks.length) {
      minIso = allTasks.reduce((a, t) => (t.start_date < a ? t.start_date : a), allTasks[0].start_date);
      maxIso = allTasks.reduce((a, t) => (t.end_date > a ? t.end_date : a), allTasks[0].end_date);
    }
    const weekStarts = [];
    let curW = parseIsoDate(minIso);
    const maxDt = parseIsoDate(maxIso);
    while (curW <= maxDt && weekStarts.length < 18) {
      weekStarts.push(formatIsoDate(curW));
      curW.setDate(curW.getDate() + 7);
    }

    const rowsXml = [];
    const headers = [
      "PHASE / SECTION",
      "TASK / SUBTASK NAME",
      "START DATE",
      "END DATE",
      "DURATION (WORK DAYS)",
      "TEAM MEMBER",
      "PERCENT COMPLETE",
      "STATUS",
      "DELIVERABLE / NOTES"
    ];
    weekStarts.forEach((ws, i) => headers.push(`WEEK ${i + 1} (${ws.slice(5)})`));

    const hdrCells = headers.map((h, idx) => {
      const ref = `${colLetter(idx + 1)}1`;
      return `<c r="${ref}" s="1" t="inlineStr"><is><t>${xmlEsc(h)}</t></is></c>`;
    }).join("");
    rowsXml.push(`<row r="1" ht="24" customHeight="1">${hdrCells}</row>`);

    let rNum = 2;
    const emitRow = (codeLabel, nameStr, sIso, eIso, memName, pctVal, statusStr, notesStr) => {
      const sSerial = isoToExcelSerial(sIso);
      const eSerial = isoToExcelSerial(eIso);
      const wDays = countWorkDays(sIso, eIso);
      const pctFrac = +(pctVal / 100).toFixed(4);
      const cells = [
        `<c r="A${rNum}" t="inlineStr"><is><t>${xmlEsc(codeLabel)}</t></is></c>`,
        `<c r="B${rNum}" t="inlineStr"><is><t>${xmlEsc(nameStr)}</t></is></c>`,
        sSerial ? `<c r="C${rNum}" s="3"><v>${sSerial}</v></c>` : "",
        eSerial ? `<c r="D${rNum}" s="3"><v>${eSerial}</v></c>` : "",
        `<c r="E${rNum}" s="5"><f>IF(OR(C${rNum}="",D${rNum}=""),"",NETWORKDAYS(C${rNum},D${rNum}))</f><v>${wDays}</v></c>`,
        `<c r="F${rNum}" t="inlineStr"><is><t>${xmlEsc(memName)}</t></is></c>`,
        `<c r="G${rNum}" s="4"><v>${pctFrac}</v></c>`,
        `<c r="H${rNum}" t="inlineStr"><is><t>${xmlEsc(statusStr)}</t></is></c>`,
        `<c r="I${rNum}" t="inlineStr"><is><t>${xmlEsc(notesStr || "")}</t></is></c>`
      ];
      weekStarts.forEach((ws, wIdx) => {
        const we = addDaysIso(ws, 6);
        if (sIso <= we && eIso >= ws) {
          const colRef = `${colLetter(10 + wIdx)}${rNum}`;
          cells.push(`<c r="${colRef}" s="6" t="inlineStr"><is><t>${pctVal}%</t></is></c>`);
        }
      });
      rowsXml.push(`<row r="${rNum}" ht="19" customHeight="1">${cells.join("")}</row>`);
      rNum++;
    };

    for (const sec of (appState.sections || [])) {
      const secTasks = allTasks.filter(t => t.section_id === sec.id);
      rowsXml.push(
        `<row r="${rNum}" ht="21" customHeight="1">` +
        `<c r="A${rNum}" s="2" t="inlineStr"><is><t>${xmlEsc(sec.title)}</t></is></c>` +
        `</row>`
      );
      rNum++;

      for (const t of secTasks) {
        const m = computeTaskMetrics(t, todayIso);
        const mem = getMember(t.owner);
        emitRow(sec.code, t.title, t.start_date, t.end_date, mem.name, m.pct, t.status, t.deliverable || "");
        for (const st of (t.subtasks || [])) {
          normalizeSubtask(st, t);
          const sMem = getMember(st.owner || t.owner);
          const stStatus = st.progress_pct >= 100 ? "Done" : (st.progress_pct > 0 ? "Doing" : "Todo");
          emitRow("SUBTASK", "  ↳ " + st.title, st.start_date, st.end_date, sMem.name, st.progress_pct, stStatus, "");
        }
      }
    }

    const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

    <col min="8" max="8" width="12" customWidth="1"/>
    <col min="9" max="9" width="44" customWidth="1"/>
    <col min="10" max="${9 + Math.max(1, weekStarts.length)}" width="13" customWidth="1"/>
  </cols>
  <sheetData>${rowsXml.join("")}</sheetData>
</worksheet>`;

    const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

  <fills count="5">
    <fill><patternFill patternType="none"/></fill>

  </fills>
  <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="7">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>

    <xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
    <xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>

    const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

  </sheets>

    const wbRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

    const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

    const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">

    return buildStoredZip([
      { name: "[Content_Types].xml", data: contentTypesXml },
      { name: "_rels/.rels", data: rootRelsXml },
      { name: "xl/workbook.xml", data: workbookXml },
      { name: "xl/_rels/workbook.xml.rels", data: wbRelsXml },

      { name: "xl/worksheets/sheet1.xml", data: sheetXml }

  function triggerDownload(bytesOrStr, filename, mime) {
    const blob = new Blob([bytesOrStr], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  window.exportLaunchXlsx = function() {
    const bytes = generateMuniLmXlsxBytes();
    triggerDownload(
      bytes,
      `MuniLM_Launch_Roadshow_${todayIsoStr()}.xlsx`,
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    );
    showToast("Exported MuniLM Launch Excel (.xlsx)");
  };

  window.exportLaunchJson = function() {
    const json = JSON.stringify(appState, null, 2);
    triggerDownload(json, `MuniLM_Launch_Snapshot_${todayIsoStr()}.json`, "application/json");
    showToast("Exported MuniLM Launch JSON snapshot");
  };

  // --- ZIP / XLSX Reader for Round-Trip Import ---
  async function extractZipEntries(arrayBuf) {
    const u8 = new Uint8Array(arrayBuf);
    const dv = new DataView(arrayBuf);
    let eocdPos = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054B50) { eocdPos = i; break; }
    }
    if (eocdPos < 0) throw new Error("Invalid .xlsx archive");
    const totalEntries = dv.getUint16(eocdPos + 10, true);
    const cdOffset = dv.getUint32(eocdPos + 16, true);
    const dec = new TextDecoder("utf-8");
    const entries = {};
    let ptr = cdOffset;

    for (let e = 0; e < totalEntries; e++) {
      if (dv.getUint32(ptr, true) !== 0x02014B50) break;
      const method = dv.getUint16(ptr + 10, true);
      const compSize = dv.getUint32(ptr + 20, true);
      const nameLen = dv.getUint16(ptr + 28, true);
      const extraLen = dv.getUint16(ptr + 30, true);
      const commentLen = dv.getUint16(ptr + 32, true);
      const localOff = dv.getUint32(ptr + 42, true);
      const name = dec.decode(u8.subarray(ptr + 46, ptr + 46 + nameLen));
      ptr += 46 + nameLen + extraLen + commentLen;

      const lNameLen = dv.getUint16(localOff + 26, true);
      const lExtraLen = dv.getUint16(localOff + 28, true);
      const dataStart = localOff + 30 + lNameLen + lExtraLen;
      const slice = u8.subarray(dataStart, dataStart + compSize);

      if (method === 0) {
        entries[name] = dec.decode(slice);
      } else if (method === 8 && typeof DecompressionStream !== "undefined") {
        const ds = new DecompressionStream("deflate-raw");
        const writer = ds.writable.getWriter();
        writer.write(slice);
        writer.close();
        const ab = await new Response(ds.readable).arrayBuffer();
        entries[name] = dec.decode(new Uint8Array(ab));
      }
    }
    return entries;
  }

  async function importFromXlsxBuffer(arrayBuf) {
    const entries = await extractZipEntries(arrayBuf);
    const parser = new DOMParser();
    const sharedStrings = [];
    if (entries["xl/sharedStrings.xml"]) {
      const ssDoc = parser.parseFromString(entries["xl/sharedStrings.xml"], "application/xml");
      ssDoc.querySelectorAll("si").forEach(si => {
        sharedStrings.push(Array.from(si.querySelectorAll("t")).map(t => t.textContent || "").join(""));
      });
    }
    const sheetXml = entries["xl/worksheets/sheet1.xml"];
    if (!sheetXml) throw new Error("Missing worksheet in .xlsx");
    const sDoc = parser.parseFromString(sheetXml, "application/xml");

    const sections = [];
    const tasks = [];
    let curSec = null;
    let lastParentTask = null;
    const palette = ["#0F766E", "#F05332", "#2563EB", "#7C3AED", "#BE185D"];
    const members = appState.team_members || [];

    const readCellVal = (cEl) => {
      const tAttr = cEl.getAttribute("t");
      if (tAttr === "s") {
        const idx = parseInt(cEl.querySelector("v")?.textContent || "0", 10);
        return sharedStrings[idx] || "";
      }
      if (tAttr === "inlineStr") {
        return Array.from(cEl.querySelectorAll("is t")).map(x => x.textContent || "").join("");
      }
      return cEl.querySelector("v")?.textContent || "";
    };

    let headerMap = { endCol: "D", memberCol: "F", pctCol: "G", statusCol: "H", notesCol: "I" };
    sDoc.querySelectorAll("sheetData row").forEach((rEl, rIdx) => {
      const map = {};
      rEl.querySelectorAll("c").forEach(cEl => {
        const ref = (cEl.getAttribute("r") || "").replace(/\d+/g, "");
        map[ref] = readCellVal(cEl).trim();
      });
      if (rIdx === 0) {
        if ((map.E || "").toUpperCase().includes("END")) {
          headerMap = { endCol: "E", memberCol: "I", pctCol: "J", statusCol: "K", notesCol: "L" };
        }
        return;
      }
      const colA = map.A || "";
      const colB = map.B || "";
      if (colA && !colB) {
        const col = palette[sections.length % palette.length];
        curSec = {
          id: "sec_imp_" + (sections.length + 1),
          code: `PHASE ${sections.length + 1}`,
          title: colA,
          subtitle: "",
          color: col,
          bg: col + "22"
        };
        sections.push(curSec);
        lastParentTask = null;
        return;
      }
      if (!colB || colB.toUpperCase().includes("TASK")) return;
      if (!curSec) {
        curSec = { id: "sec_imp_1", code: "PHASE 1", title: "MuniLM Launch Schedule", subtitle: "", color: "#F05332", bg: "#FFEDD5" };
        sections.push(curSec);
      }

      const rawStart = map.C || "";
      const rawEnd = map[headerMap.endCol] || "";
      const sIso = /^\d{4}-\d{2}-\d{2}/.test(rawStart) ? rawStart.slice(0, 10) : (excelSerialToIso(rawStart) || todayIsoStr());
      const eIso = /^\d{4}-\d{2}-\d{2}/.test(rawEnd) ? rawEnd.slice(0, 10) : (excelSerialToIso(rawEnd) || sIso);

      const rawMember = (map[headerMap.memberCol] || "").toLowerCase();
      const matchedMem = members.find(m => rawMember.includes(m.name.toLowerCase()) || rawMember === m.id) || members[0];

      let rawPct = parseFloat(map[headerMap.pctCol] || "0");
      if (!Number.isFinite(rawPct)) rawPct = 0;
      const pct = rawPct <= 1 && rawPct > 0 ? Math.round(rawPct * 100) : Math.round(rawPct);

      const isSub = colA.toUpperCase() === "SUBTASK" || colB.trim().startsWith("↳");
      if (isSub && lastParentTask) {
        lastParentTask.subtasks.push(normalizeSubtask({
          id: "sub_imp_" + Date.now().toString(36) + "_" + lastParentTask.subtasks.length,
          title: colB.replace(/^\s*↳\s*/, "").trim(),
          owner: matchedMem ? matchedMem.id : lastParentTask.owner,
          start_date: sIso,
          end_date: eIso >= sIso ? eIso : sIso,
          progress_pct: pct,
          done: pct >= 100
        }, lastParentTask));
        return;
      }

      const rawStatus = map[headerMap.statusCol] || (pct >= 100 ? "Done" : (pct > 0 ? "Doing" : "Todo"));
      const parentTask = normalizeTask({
        id: "tsk_imp_" + (tasks.length + 1),
        section_id: curSec.id,
        title: colB,
        owner: matchedMem ? matchedMem.id : "both",
        status: STATUS_LIST.includes(rawStatus) ? rawStatus : (pct >= 100 ? "Done" : "Doing"),
        priority: 4,
        progress_pct: pct,
        start_date: sIso,
        end_date: eIso >= sIso ? eIso : sIso,
        starred: false,
        deliverable: map[headerMap.notesCol] || "",
        links: [],
        subtasks: []
      });
      tasks.push(parentTask);
      lastParentTask = parentTask;
    });

    if (!tasks.length) throw new Error("No tasks found in workbook");
    appState.sections = sections;
    appState.tasks = tasks;
  }

  window.handleImportFile = async function(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      if (file.name.toLowerCase().endsWith(".json")) {
        const txt = await file.text();
        const obj = JSON.parse(txt);
        if (!Array.isArray(obj.sections) || !Array.isArray(obj.tasks)) {
          throw new Error("Invalid MuniLM Launch JSON snapshot");
        }
        appState = obj;
      } else {
        const ab = await file.arrayBuffer();
        await importFromXlsxBuffer(ab);
      }
      ui.phaseFilter = "ALL";
      ui.ownerFilter = "ALL";
      scheduleSaveState("Imported schedule (" + appState.tasks.length + " tasks)");
      renderApp();
    } catch (err) {
      alert("Import error: " + (err && err.message ? err.message : String(err)));
    }
  };

  // --- Vault Boot & Unlock Lifecycle ---
  async function unlockWithKey(passkey, silent) {
    if (!passkey || !passkey.trim()) return false;
    try {
      const rawEnv = JSON.parse(document.getElementById("encryptedBundlePayload").textContent);
      const base = rawEnv.unencrypted_launch
        ? rawEnv.unencrypted_launch
        : await decryptEnvelope(rawEnv, passkey);

      baselineState = deepClone(base);
      await initSessionEncryptionKey(passkey);

      let loaded = null;
      const savedRaw = localStorage.getItem(LOCAL_STATE_ENC_KEY);
      if (savedRaw) {
        try {
          const savedEnv = JSON.parse(savedRaw);
          loaded = savedEnv.unencrypted_local
            ? savedEnv.unencrypted_local
            : await decryptEnvelope(savedEnv, passkey);
        } catch (_ignore) {
          loaded = null;
        }
      }
      appState = loaded && Array.isArray(loaded.tasks) ? loaded : deepClone(baselineState);

      localStorage.setItem(VAULT_STORAGE_KEY, passkey.trim());
      setVaultUnlockedHeader(true);
      document.getElementById("authGate").classList.add("hidden");
      document.getElementById("launchAppRoot").classList.remove("hidden");
      renderApp();
      return true;
    } catch (_err) {
      if (!silent) {
        document.getElementById("authError").textContent = "Invalid MuniLM invite key.";
      }
      return false;
    }
  }

  function setVaultUnlockedHeader(unlocked) {
    const badge = document.getElementById("vaultBadge");
    const btn = document.getElementById("lockVaultBtn");
    if (unlocked) {
      badge.textContent = "✓ Vault Unlocked";
      badge.classList.remove("locked");
      btn.style.display = "inline-flex";
    } else {
      badge.textContent = "Encrypted Launch Vault";
      badge.classList.add("locked");
      btn.style.display = "none";
    }
  }

  window.lockLaunchVault = function() {
    localStorage.removeItem(VAULT_STORAGE_KEY);
    location.reload();
  };

  (async function boot() {
    loadUiPrefs();
    const hm = (window.location.hash || "").match(/(?:^|[&#])key=([^&]+)/);
    let hk = null;
    if (hm) {
      try { hk = decodeURIComponent(hm[1]).trim(); } catch (_e) { hk = String(hm[1] || "").trim(); }
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    const rawEnv = JSON.parse(document.getElementById("encryptedBundlePayload").textContent);
    if (rawEnv && rawEnv.unencrypted_launch) {
      isUnencryptedLocal = true;
      baselineState = deepClone(rawEnv.unencrypted_launch);
      let loaded = null;
      try {
        const s = JSON.parse(localStorage.getItem(LOCAL_STATE_ENC_KEY) || "null");
        if (s && s.unencrypted_local) loaded = s.unencrypted_local;
      } catch (_e) {}
      appState = loaded && Array.isArray(loaded.tasks) ? loaded : deepClone(baselineState);
      setVaultUnlockedHeader(true);
      document.getElementById("authGate").classList.add("hidden");
      document.getElementById("launchAppRoot").classList.remove("hidden");
      renderApp();
      return;
    }

    if (hk && (await unlockWithKey(hk, false))) return;
    const savedKey = localStorage.getItem(VAULT_STORAGE_KEY);
    if (savedKey && (await unlockWithKey(savedKey, true))) return;

    document.getElementById("unlockForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      document.getElementById("authError").textContent = "";
      await unlockWithKey(document.getElementById("unlockInput").value, false);
    });
  })();
})();
