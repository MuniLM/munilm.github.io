<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MuniLM Launch — Investor Readiness &amp; Roadshow</title>
  <link rel="icon" type="image/png" href="./assets/brand/logomark_orange.png" />
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('./assets/fonts/Figtree-VariableFont_wght.ttf') format('truetype');
      font-weight: 300 900;
      font-display: swap;
    }
    :root {
      --muni-orange: #F05332;
      --muni-orange-soft: rgba(240, 83, 50, 0.11);
      --muni-ink: #141519;
      --muni-charcoal: #272A34;
      --muni-muted: #646A7A;
      --muni-pearl: #F3F3F6;
      --muni-border: rgba(20, 21, 25, 0.085);
      --muni-border-strong: rgba(20, 21, 25, 0.15);
      --pass-green: #0F9D58;
      --pass-bg: rgba(15, 157, 88, 0.12);
      --warn-amber: #C66900;
      --warn-bg: rgba(217, 119, 6, 0.13);
      --fail-red: #DC2626;
      --fail-bg: rgba(220, 38, 38, 0.11);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--muni-pearl);
      background-image:
        radial-gradient(circle at 14% 90%, rgba(240, 83, 50, 0.11) 0%, transparent 40%),
        radial-gradient(circle at 86% 12%, rgba(37, 99, 235, 0.09) 0%, transparent 38%);
      color: var(--muni-ink);
      min-height: 100vh;
      padding: 24px 20px 72px;
    }
    .shell { max-width: 1440px; margin: 0 auto; }
    .topbar {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px -10px rgba(20, 21, 25, 0.06);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar img { height: 32px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--muni-border-strong);
      background: #FFF;
      color: var(--muni-ink);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .pill-btn:hover { border-color: var(--muni-orange); color: var(--muni-orange); }
    .pill-btn-orange {
      background: var(--muni-orange);
      color: #FFF;
      border-color: var(--muni-orange);
    }
    .pill-btn-orange:hover { background: #D94323; color: #FFF; border-color: #D94323; }
    .pill-btn-dark {
      background: var(--muni-ink);
      color: #FFF;
      border-color: var(--muni-ink);
    }
    .pill-btn-dark:hover { background: var(--muni-orange); border-color: var(--muni-orange); color: #FFF; }
    .vault-status {
      font-size: 11.5px;
      font-weight: 800;
      background: var(--pass-bg);
      color: var(--pass-green);
      padding: 6px 13px;
      border-radius: 999px;
    }
    .vault-status.locked { background: var(--muni-ink); color: #FFF; }

    /* Auth Gate */
    .auth-gate {
      max-width: 520px;
      margin: 56px auto;
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 24px;
      padding: 34px 36px;
      box-shadow: 0 20px 50px -15px rgba(20, 21, 25, 0.10);
      text-align: center;
    }
    .auth-gate.hidden { display: none; }
    .auth-gate h2 { font-size: 24px; font-weight: 800; margin: 12px 0 8px; }
    .auth-gate p { font-size: 14px; color: var(--muni-muted); line-height: 1.55; margin-bottom: 20px; }
    .auth-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--muni-border-strong);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .auth-input:focus { border-color: var(--muni-orange); }
    .hidden { display: none !important; }

    /* Hero + KPI Strip */
    .hero {
      background: linear-gradient(125deg, #FFFFFF 58%, rgba(240, 83, 50, 0.09) 100%);
      border: 1px solid var(--muni-border);
      border-radius: 22px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      box-shadow: 0 12px 34px -12px rgba(20, 21, 25, 0.05);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muni-orange);
      margin-bottom: 6px;
    }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 5px; }
    .hero p { font-size: 13.5px; color: var(--muni-muted); line-height: 1.5; max-width: 780px; }
    .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-tile {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--muni-border);
      border-radius: 16px;
      padding: 14px 16px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .kpi-tile.clickable { cursor: pointer; }
    .kpi-tile.clickable:hover { transform: translateY(-2px); border-color: var(--muni-orange); }
    .kpi-tile.active-filter { border-color: var(--muni-orange); box-shadow: 0 0 0 2px rgba(240, 83, 50, 0.16); }
    .kpi-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muni-muted); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
    .kpi-val { font-size: 22px; font-weight: 800; color: var(--muni-ink); margin-bottom: 3px; display: flex; align-items: baseline; gap: 8px; }
    .kpi-sub { font-size: 11.5px; color: var(--muni-muted); line-height: 1.35; }
    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .health-on-track { background: var(--pass-bg); color: var(--pass-green); }
    .health-at-risk { background: var(--warn-bg); color: var(--warn-amber); }
    .health-off-track { background: var(--fail-bg); color: var(--fail-red); }

    /* Command Card & Controls */
    .command-card {
      background: #FFFFFF;
      border: 1px solid var(--muni-border);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 14px 38px -14px rgba(20, 21, 25, 0.06);
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 11px;
      margin-bottom: 11px;
      border-bottom: 1px solid var(--muni-border);
    }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cluster-chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--muni-border);
      background: #F8FAFC;
      color: var(--muni-charcoal);
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .cluster-chip:hover { border-color: rgba(240, 83, 50, 0.4); }
    .cluster-chip.active {
      background: var(--muni-ink);
      color: #FFF;
      border-color: var(--muni-ink);
    }
    .filter-pill {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--muni-border);
      background: #FFF;
      color: var(--muni-charcoal);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .filter-pill.active {
      background: var(--muni-orange-soft);
      color: var(--muni-orange);
      border-color: rgba(240, 83, 50, 0.45);
      font-weight: 800;
    }
    .avatar-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #FFF;
      font-size: 9px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .quick-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .inp, .sel {
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--muni-border-strong);
      background: #FFF;
      color: var(--muni-ink);
      outline: none;
    }
    .inp:focus, .sel:focus { border-color: var(--muni-orange); }

    /* MuniLM Gantt Container & Resizable Task Column */
    .gantt-wrap {
      --task-col-w: 400px;
      --meta-cols-w: 418px; /* 92 (Member) + 108 (Start) + 108 (End) + 110 (% Done) */
      border: 1px solid var(--muni-border-strong);
      border-radius: 16px;
      overflow-x: auto;
      background: #FFF;
      position: relative;
    }
    .gantt-minwidth {
      min-width: 1060px;
      position: relative;
    }
    .gantt-hdr-top, .gantt-hdr-days, .gantt-sec-row, .gantt-task-row, .gantt-sub-row {
      display: grid;
      align-items: stretch;
    }
    .gantt-left-cols {
      display: grid;
      grid-template-columns: var(--task-col-w) 92px 108px 108px 110px;
      align-items: center;
      border-right: 1.5px solid var(--muni-border-strong);
      background: inherit;
    }
    .gantt-cell {
      padding: 5px 7px;
      font-size: 11.5px;
      border-right: 1px solid rgba(20, 21, 25, 0.055);
      overflow: hidden;
      min-width: 0;
      position: relative;
    }
    .gantt-cell:last-child { border-right: none; }
    .gantt-hdr-cell {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muni-muted);
      padding: 8px 8px;
      background: #F8FAFC;
      white-space: nowrap;
    }

    /* Draggable Column Resizer Handle & Full-Height Rail */
    .col-resize-grip {
      position: absolute;
      top: 0;
      right: -4px;
      bottom: 0;
      width: 9px;
      cursor: col-resize;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .col-resize-grip::after {
      content: "";
      width: 3px;
      height: 16px;
      border-left: 1px solid #94A3B8;
      border-right: 1px solid #94A3B8;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .col-resize-grip:hover::after,
    .gantt-wrap.resizing-col .col-resize-grip::after {
      border-color: var(--muni-orange);
      background: var(--muni-orange);
    }
    .col-resize-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--task-col-w) - 3px);
      width: 7px;
      cursor: col-resize;
      z-index: 18;
      background: transparent;
      transition: background 0.12s ease;
    }
    .col-resize-rail:hover,
    .gantt-wrap.resizing-col .col-resize-rail {
      background: rgba(240, 83, 50, 0.35);
    }

    /* Row Styles & Inline Editable Inputs */
    .gantt-sec-row {
      background: #F8FAFC;
      border-top: 1px solid var(--muni-border-strong);
      border-bottom: 1px solid var(--muni-border);
      font-weight: 800;
    }
    .gantt-task-row {
      background: #FFFFFF;
      border-bottom: 1px solid rgba(20, 21, 25, 0.055);
      transition: background 0.1s ease;
    }
    .gantt-task-row:hover { background: #F9FAFB; }
    .gantt-sub-row {
      background: #FCFCFD;
      border-bottom: 1px dashed rgba(20, 21, 25, 0.055);
    }
    .gantt-sub-row:hover { background: #F4F6FA; }

    .collapse-btn {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muni-muted);
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .collapse-btn:hover {
      background: rgba(20, 21, 25, 0.07);
      color: var(--muni-ink);
    }

    .inline-text-inp {
      width: 100%;
      min-width: 0;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muni-ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 5px;
      outline: none;
      text-overflow: ellipsis;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .inline-text-inp:hover {
      border-color: rgba(20, 21, 25, 0.13);
      background: #FFF;
    }
    .inline-text-inp:focus {
      border-color: var(--muni-orange);
      background: #FFF;
      box-shadow: 0 0 0 2px rgba(240, 83, 50, 0.12);
    }
    .inline-text-inp.sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muni-charcoal);
    }
    .inline-text-inp.done-strike {
      text-decoration: line-through;
      color: var(--muni-muted);
    }

    .inline-member-sel {
      width: 100%;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 4px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      outline: none;
    }
    .inline-member-sel:hover, .inline-member-sel:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }

    .inline-date-inp {
      width: 100%;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muni-charcoal);
      padding: 3px 4px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      outline: none;
      cursor: pointer;
    }
    .inline-date-inp:hover, .inline-date-inp:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }
    .inline-date-inp.overdue {
      color: var(--fail-red);
      font-weight: 800;
    }

    .inline-pct-num {
      width: 38px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 800;
      text-align: right;
      color: var(--muni-ink);
      padding: 2px 3px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      outline: none;
      -moz-appearance: textfield;
    }
    .inline-pct-num::-webkit-outer-spin-button,
    .inline-pct-num::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .inline-pct-num:hover, .inline-pct-num:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }

    .row-icon-btn {
      border: 1px solid rgba(20, 21, 25, 0.14);
      background: #FFF;
      color: var(--muni-charcoal);
      border-radius: 5px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.35;
    }
    .row-icon-btn:hover {
      border-color: var(--muni-orange);
      color: var(--muni-orange);
    }
    .sub-del-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--fail-red);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 3px;
      transition: opacity 0.12s ease;
    }
    .gantt-sub-row:hover .sub-del-btn,
    .gantt-sub-row:focus-within .sub-del-btn { opacity: 0.85; }
    .sub-del-btn:hover { opacity: 1 !important; }

    /* Gantt Timeline Track & Draggable Bubbles */
    .gantt-track {
      position: relative;
      display: grid;
      align-items: center;
      min-height: 39px;
      user-select: none;
    }
    .gantt-sub-row .gantt-track { min-height: 33px; }
    .gantt-day-bg {
      height: 100%;
      border-right: 1px solid rgba(20, 21, 25, 0.04);
    }
    .gantt-day-bg.weekend { background: rgba(241, 245, 249, 0.68); }
    .gantt-day-bg.week-start { border-left: 1px solid rgba(20, 21, 25, 0.11); }
    .gantt-today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--muni-orange);
      z-index: 4;
      pointer-events: none;
      opacity: 0.8;
    }
    .gantt-bubble {
      position: absolute;
      height: 24px;
      border-radius: 7px;
      z-index: 5;
      display: flex;
      align-items: center;
      padding: 0 10px;
      cursor: grab;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(20, 21, 25, 0.08);
      transition: box-shadow 0.12s ease;
    }
    .gantt-bubble:active { cursor: grabbing; }
    .gantt-bubble.sub {
      height: 19px;
      border-radius: 999px;
      padding: 0 9px;
    }
    .gantt-bubble-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;
      opacity: 0.24;
    }
    .gantt-bubble-lbl {
      position: relative;
      z-index: 1;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .gantt-grip {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      z-index: 6;
      cursor: ew-resize;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .gantt-grip.left { left: 0; border-right: 2px solid rgba(20, 21, 25, 0.25); }
    .gantt-grip.right { right: 0; border-left: 2px solid rgba(20, 21, 25, 0.25); }
    .gantt-bubble:hover .gantt-grip { opacity: 1; background: rgba(255, 255, 255, 0.45); }

    /* Progress Slider */
    .prog-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 48px;
      height: 5px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .prog-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #FFF;
      border: 2px solid var(--muni-ink);
      cursor: pointer;
    }
    .mono-num { font-family: var(--mono); font-size: 11px; font-weight: 700; }

    /* Table View */
    .table-wrap {
      border: 1px solid var(--muni-border-strong);
      border-radius: 16px;
      overflow-x: auto;
      background: #FFF;
    }
    table.muni-tbl { width: 100%; border-collapse: collapse; min-width: 920px; }
    table.muni-tbl th {
      text-align: left;
      padding: 10px 12px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--muni-border-strong);
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muni-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    table.muni-tbl th:hover { color: var(--muni-orange); }
    table.muni-tbl td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(20, 21, 25, 0.06);
      font-size: 12.5px;
      vertical-align: middle;
    }
    table.muni-tbl tr.tbl-row:hover { background: #F9FAFB; }
    table.muni-tbl tr.tbl-sub-row { background: #FCFCFD; }

    /* Kanban View */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(230px, 1fr));
      gap: 12px;
      overflow-x: auto;
    }
    .kanban-col {
      background: var(--muni-pearl);
      border: 1px solid var(--muni-border);
      border-radius: 16px;
      padding: 12px;
      min-height: 360px;
    }
    .kanban-col.drag-over {
      border-color: var(--muni-orange);
      background: rgba(240, 83, 50, 0.06);
    }
    .kanban-card {
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
      cursor: grab;
      box-shadow: 0 3px 8px rgba(20, 21, 25, 0.04);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .kanban-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(20, 21, 25, 0.08);
    }

    /* Slide-Over Drawer & Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 21, 25, 0.38);
      backdrop-filter: blur(3px);
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: flex-end;
    }
    .backdrop.open { display: flex; }
    .drawer {
      width: min(580px, 96vw);
      height: 100vh;
      background: #FFF;
      box-shadow: -16px 0 44px rgba(20, 21, 25, 0.18);
      padding: 24px 26px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-center { justify-content: center; }
    .modal-box {
      width: min(640px, 94vw);
      max-height: 88vh;
      background: #FFF;
      border-radius: 20px;
      padding: 24px 26px;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(20, 21, 25, 0.22);
    }
    .field-lbl {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muni-muted);
      margin-bottom: 5px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 22px;
      background: var(--muni-ink);
      color: #FFF;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      z-index: 120;
      box-shadow: 0 10px 26px rgba(20, 21, 25, 0.22);
      display: none;
    }
    .toast.show { display: block; }

    @media print {
      body { background: #FFF; padding: 0; }
      .topbar-right, .quick-bar, .no-print { display: none !important; }
      .shell { max-width: 100%; }
      .gantt-wrap { overflow: visible; }
    }
  </style>
</head>

  <script>
(function() {
  "use strict";

  const VAULT_STORAGE_KEY = "munilm_team_vault_key_v1";
  const LOCAL_STATE_ENC_KEY = "munilm_launch_state_enc_v1";
  const UI_PREFS_STORAGE_KEY = "munilm_launch_ui_prefs_v1";
  const DEFAULT_TASK_COL_WIDTH = 400;
  const MIN_TASK_COL_WIDTH = 230;
  const MAX_TASK_COL_WIDTH = 860;

  const STATUS_LIST = ["Todo", "Doing", "Stuck", "Done"];
  const STATUS_STYLE = {
    "Todo":  { bg: "#FEF3C7", color: "#B45309", border: "#FCD34D" },
    "Doing": { bg: "#DBEAFE", color: "#1D4ED8", border: "#93C5FD" },
    "Stuck": { bg: "#FCE7F3", color: "#BE185D", border: "#F9A8D4" },
    "Done":  { bg: "#DCFCE7", color: "#15803D", border: "#86EFAC" }
  };

  let baselineState = null;
  let appState = null;
  let sessionSalt = null;
  let sessionCryptoKey = null;
  let isUnencryptedLocal = false;
  let saveTimer = null;

  // UI View State
  let ui = {
    viewMode: "GANTT",         // GANTT | TABLE | KANBAN
    zoomMode: "FULL",          // 3W | 6W | FULL
    panOffsetDays: 0,
    taskColWidth: DEFAULT_TASK_COL_WIDTH,
    colorBy: "OWNER",          // OWNER | PHASE | STATUS
    ownerFilter: "ALL",        // ALL | <member.id> | PLATE_<member.id>
    phaseFilter: "ALL",
    searchQuery: "",
    collapsedSections: {},
    collapsedTasks: {},
    tableSortField: "start_date",
    tableSortDir: "asc",
    activeDrawerTaskId: null,
    draggingKanbanTaskId: null
  };

  function loadUiPrefs() {
    try {
      const raw = JSON.parse(localStorage.getItem(UI_PREFS_STORAGE_KEY) || "null");
      if (raw && typeof raw === "object") {
        const w = Number(raw.taskColWidth);
        if (Number.isFinite(w)) {
          ui.taskColWidth = Math.max(MIN_TASK_COL_WIDTH, Math.min(MAX_TASK_COL_WIDTH, Math.round(w)));
        }
      }
    } catch (_e) {}
  }

  function saveUiPrefs() {
    try {
      localStorage.setItem(UI_PREFS_STORAGE_KEY, JSON.stringify({ taskColWidth: ui.taskColWidth }));
    } catch (_e) {}
  }

  // --- Safe DOM Escaping Helpers ---
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function escAttr(v) { return esc(v); }
  function escJs(v) {
    return String(v == null ? "" : v)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\r/g, "")
      .replace(/\n/g, "\\n");
  }

  function showToast(msg) {
    const el = document.getElementById("launchToast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._tid);
    el._tid = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  // --- WebCrypto Helpers ---
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  async function deriveAesKey(passkey, saltBytes, iterations, usages) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(passkey.trim()),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: iterations || 210000, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      usages
    );
  }

  async function decryptEnvelope(env, passkey) {
    const key = await deriveAesKey(passkey, b64ToBytes(env.salt_b64), env.iterations || 210000, ["decrypt"]);
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(env.nonce_b64) },
      key,
      b64ToBytes(env.ciphertext_b64)
    );
    return JSON.parse(new TextDecoder("utf-8").decode(pt));
  }

  async function initSessionEncryptionKey(passkey) {
    sessionSalt = crypto.getRandomValues(new Uint8Array(16));
    sessionCryptoKey = await deriveAesKey(passkey, sessionSalt, 210000, ["encrypt"]);
  }

  function scheduleSaveState(label) {
    if (!appState) return;
    appState.updated_at = new Date().toISOString();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => persistStateNow(label), 180);
  }

  async function persistStateNow(label) {
    const ind = document.getElementById("saveIndicator");
    try {
      const payloadBytes = new TextEncoder().encode(JSON.stringify(appState));
      if (isUnencryptedLocal || !sessionCryptoKey) {
        localStorage.setItem(LOCAL_STATE_ENC_KEY, JSON.stringify({ unencrypted_local: appState }));
      } else {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sessionCryptoKey, payloadBytes);
        const env = {
          kdf: "PBKDF2-SHA256",
          cipher: "AES-256-GCM",
          iterations: 210000,
          salt_b64: bytesToB64(sessionSalt),
          nonce_b64: bytesToB64(iv),
          ciphertext_b64: bytesToB64(new Uint8Array(ct))
        };
        localStorage.setItem(LOCAL_STATE_ENC_KEY, JSON.stringify(env));
      }
      if (ind) {
        const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        ind.style.display = "inline-flex";
        ind.textContent = "✓ Saved (AES-GCM) • " + t;
      }
      if (label) showToast(label);
    } catch (_e) {
      if (ind) ind.textContent = "Save warning";
    }
  }

  // --- Date & Task/Subtask Normalization ---
  function todayIsoStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function parseIsoDate(iso) {
    if (!iso || typeof iso !== "string" || iso.length < 10) return null;
    const p = iso.slice(0, 10).split("-").map(Number);
    if (p.length !== 3 || isNaN(p[0]) || isNaN(p[1]) || isNaN(p[2])) return null;
    return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
  }

  function formatIsoDate(dt) {
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const d = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function addDaysIso(iso, deltaDays) {
    const base = parseIsoDate(iso) || parseIsoDate(todayIsoStr());
    base.setDate(base.getDate() + deltaDays);
    return formatIsoDate(base);
  }

  function diffCalendarDays(startIso, endIso) {
    const s = parseIsoDate(startIso);
    const e = parseIsoDate(endIso);
    if (!s || !e) return 0;
    return Math.round((e - s) / 86400000);
  }

  function countWorkDays(startIso, endIso) {
    let s = parseIsoDate(startIso);
    let e = parseIsoDate(endIso);
    if (!s || !e) return 1;
    if (e < s) { const tmp = s; s = e; e = tmp; }
    let count = 0;
    const cur = new Date(s.getTime());
    while (cur <= e) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return Math.max(1, count);
  }

  function normalizeSubtask(st, parentTask) {
    if (!st.owner) st.owner = parentTask ? parentTask.owner : "both";
    if (!st.start_date) st.start_date = parentTask ? parentTask.start_date : todayIsoStr();
    if (!st.end_date || st.end_date < st.start_date) {
      st.end_date = parentTask && parentTask.end_date >= st.start_date ? parentTask.end_date : st.start_date;
    }
    let sp = Number(st.progress_pct);
    if (!Number.isFinite(sp)) {
      sp = st.done ? 100 : 0;
    }
    sp = Math.max(0, Math.min(100, Math.round(sp)));
    st.progress_pct = sp;
    st.done = sp >= 100;
    return st;
  }

  function normalizeTask(t) {
    if (!t.start_date) t.start_date = todayIsoStr();
    if (!t.end_date || t.end_date < t.start_date) t.end_date = t.start_date;
    if (!STATUS_LIST.includes(t.status)) t.status = "Todo";
    let pct = Number(t.progress_pct);
    if (!Number.isFinite(pct)) pct = 0;
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    if (t.status === "Done") pct = 100;
    t.progress_pct = pct;
    t.priority = Math.max(1, Math.min(5, Math.round(Number(t.priority) || 3)));
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
    t.subtasks.forEach(st => normalizeSubtask(st, t));
    if (!Array.isArray(t.links)) t.links = [];
    return t;
  }

  function computeTaskMetrics(t, todayIso) {
    normalizeTask(t);
    const pct = t.status === "Done" ? 100 : t.progress_pct;
    const isDone = t.status === "Done" || pct >= 100;
    const isStuck = !isDone && t.status === "Stuck";
    const isOverdue = !isDone && Boolean(t.end_date && t.end_date < todayIso);
    return { pct, isDone, isStuck, isOverdue };
  }

  function computeDerivedHealth(tasksList, todayIso) {
    let stuck = 0;
    let overdue = 0;
    for (const t of tasksList) {
      const m = computeTaskMetrics(t, todayIso);
      if (m.isStuck) stuck++;
      if (m.isOverdue) overdue++;
    }
    if (stuck === 0 && overdue === 0) return { label: "On Track", cls: "health-on-track", stuck, overdue };
    if (stuck >= 2 || overdue >= 2 || (stuck >= 1 && overdue >= 1)) {
      return { label: "Off Track", cls: "health-off-track", stuck, overdue };
    }
    return { label: "At Risk", cls: "health-at-risk", stuck, overdue };
  }

  function getMember(ownerId) {
    const list = (appState && appState.team_members) || [];
    const found = list.find(m => m.id === ownerId);
    if (found) return found;
    return list[0] || { id: "unassigned", name: String(ownerId || "Team"), full_name: String(ownerId || "Team"), initials: "TM", color: "#64748B", bg: "#F1F5F9" };
  }

  function getSection(secId) {
    const list = (appState && appState.sections) || [];
    return list.find(s => s.id === secId) || list[0] || { id: "default", code: "PHASE", title: "General", color: "#475569", bg: "#F1F5F9" };
  }

  function taskMatchesFilters(t) {
    if (ui.phaseFilter !== "ALL" && t.section_id !== ui.phaseFilter) return false;
    if (ui.ownerFilter !== "ALL") {
      if (ui.ownerFilter.startsWith("PLATE_")) {
        const targetId = ui.ownerFilter.slice(6);
        const subMatch = (t.subtasks || []).some(s => s.owner === targetId || s.owner === "both");
        if (t.owner !== targetId && t.owner !== "both" && !subMatch) return false;
      } else {
        const subExact = (t.subtasks || []).some(s => s.owner === ui.ownerFilter);
        if (t.owner !== ui.ownerFilter && !subExact) return false;
      }
    }
    if (ui.searchQuery.trim()) {
      const q = ui.searchQuery.trim().toLowerCase();
      const sec = getSection(t.section_id);
      const mem = getMember(t.owner);
      const subText = (t.subtasks || []).map(s => s.title).join(" ");
      const hay = `${t.title} ${t.deliverable || ""} ${sec.title} ${mem.name} ${subText}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  // --- Timeline Window Builder ---
  function buildTimelineDays(filteredTasks) {
    const todayIso = todayIsoStr();
    let startDt;
    let totalDays;

    if (ui.zoomMode === "FULL") {
      const pool = filteredTasks.length ? filteredTasks : (appState.tasks || []);
      let minIso = appState.anchor_start || todayIso;
      let maxIso = appState.target_close || addDaysIso(todayIso, 42);
      if (pool.length) {
        minIso = pool.reduce((acc, t) => (t.start_date < acc ? t.start_date : acc), pool[0].start_date);
        maxIso = pool.reduce((acc, t) => (t.end_date > acc ? t.end_date : acc), pool[0].end_date);
      }
      startDt = parseIsoDate(addDaysIso(minIso, -2 + ui.panOffsetDays));
      const endDt = parseIsoDate(addDaysIso(maxIso, 4 + ui.panOffsetDays));
      totalDays = Math.max(21, Math.min(140, Math.round((endDt - startDt) / 86400000) + 1));
    } else {
      totalDays = ui.zoomMode === "6W" ? 42 : 21;
      startDt = parseIsoDate(addDaysIso(todayIso, -3 + ui.panOffsetDays));
    }

    const days = [];
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(startDt.getTime());
      d.setDate(startDt.getDate() + i);
      const iso = formatIsoDate(d);
      const dow = d.getDay();
      days.push({
        idx: i,
        iso,
        dayNum: d.getDate(),
        monthShort: d.toLocaleDateString("en-US", { month: "short" }),
        weekdayNarrow: ["Su", "M", "T", "W", "Th", "F", "Sa"][dow],
        isToday: iso === todayIso,
        isWeekend: dow === 0 || dow === 6,
        isMonday: dow === 1 || i === 0
      });
    }

    const weeks = [];
    let curWeek = null;
    days.forEach((d, idx) => {
      if (!curWeek || (d.isMonday && idx > 0)) {
        curWeek = { label: `WEEK ${weeks.length + 1} (${d.monthShort} ${d.dayNum})`, span: 0 };
        weeks.push(curWeek);
      }
      curWeek.span++;
    });

    window._launchTimelineDays = days;
    return { days, weeks, totalDays };
  }

  function computeBarGeom(startIso, endIso, days) {
    const total = days.length;
    const winStart = parseIsoDate(days[0].iso);
    const s = parseIsoDate(startIso) || winStart;
    const e = parseIsoDate(endIso) || s;
    const rawStart = Math.round((s - winStart) / 86400000);
    const rawEnd = Math.round((e - winStart) / 86400000);
    const outLeft = rawEnd < 0;
    const outRight = rawStart >= total;
    const clampedStart = Math.max(0, Math.min(total - 1, rawStart));
    const clampedEnd = Math.max(clampedStart, Math.min(total - 1, rawEnd));
    const leftPct = (clampedStart / total) * 100;
    const widthPct = Math.max(100 / total, ((clampedEnd - clampedStart + 1) / total) * 100);
    return { leftPct, widthPct, clampedStart, clampedEnd, outLeft, outRight };
  }

  function resolveBarPalette(task, sec, mem) {
    if (ui.colorBy === "PHASE") {
      return { bg: sec.bg || "#FFEDD5", border: sec.color || "#F05332", text: sec.color || "#F05332" };
    }
    if (ui.colorBy === "STATUS") {
      const st = STATUS_STYLE[task.status] || STATUS_STYLE.Todo;
      return { bg: st.bg, border: st.color, text: st.color };
    }
    return { bg: mem.bg || "rgba(240,83,50,0.12)", border: mem.color || "#F05332", text: mem.color || "#F05332" };
  }

            ${members.map(m => `<option value="${escAttr(m.id)}">${esc(m.name)} (${esc(m.initials)})</option>`).join("")}
          </select>
          <input id="quickTaskStart" type="date" class="inp mono-num" value="${escAttr(todayIso)}" title="Start Date" />
          <input id="quickTaskEnd" type="date" class="inp mono-num" value="${escAttr(addDaysIso(todayIso, 5))}" title="End Date / Deadline" />
          <button type="button" class="pill-btn pill-btn-orange" onclick="window.quickAddTask()">+ Add Task</button>
        </div>

        ${ui.viewMode === "GANTT"
          ? renderGanttView(filteredTasks, todayIso)
          : (ui.viewMode === "TABLE"
              ? renderTableView(filteredTasks, todayIso)
              : renderKanbanView(filteredTasks, todayIso))}
      </section>
    `;
  }

  // --- VIEW 1: Interactive MuniLM Gantt (Resizable Column, Collapsible Tasks & Full Inline Editing) ---
  function renderGanttView(filteredTasks, todayIso) {
    const { days, weeks, totalDays } = buildTimelineDays(filteredTasks);
    const minTimelinePx = Math.max(440, totalDays * (ui.zoomMode === "FULL" ? 13 : 24));
    const gridTemplate = `calc(var(--task-col-w) + var(--meta-cols-w)) minmax(${minTimelinePx}px, 1fr)`;
    const todayIdx = days.findIndex(d => d.isToday);
    const todayPct = todayIdx >= 0 ? ((todayIdx + 0.5) / totalDays) * 100 : -1;
    const denseDays = totalDays > 45;
    const members = appState.team_members || [];

    const sectionsToRender = (appState.sections || []).filter(
      sec => ui.phaseFilter === "ALL" || sec.id === ui.phaseFilter
    );

    const sectionsHtml = sectionsToRender.map(sec => {
      const secTasks = filteredTasks.filter(t => t.section_id === sec.id);
      const secCollapsed = Boolean(ui.collapsedSections[sec.id]);
      const secIdJs = escJs(sec.id);

      let secPctSum = 0;
      let secDoneTasks = 0;
      let minS = "", maxE = "";
      for (const t of secTasks) {
        const m = computeTaskMetrics(t, todayIso);
        secPctSum += m.pct;
        if (m.isDone) secDoneTasks++;
        if (!minS || t.start_date < minS) minS = t.start_date;
        if (!maxE || t.end_date > maxE) maxE = t.end_date;
      }
      const secPct = secTasks.length > 0 ? Math.round(secPctSum / secTasks.length) : 0;
      const secHealth = computeDerivedHealth(secTasks, todayIso);
      const secGeom = (minS && maxE) ? computeBarGeom(minS, maxE, days) : null;

      const secHeaderRow = `
        <div class="gantt-sec-row" style="grid-template-columns:${gridTemplate};">
          <div class="gantt-left-cols" style="background:${escAttr(sec.bg)}55;">
            <div class="gantt-cell" style="display:flex; align-items:center; gap:6px;">
              <button type="button" class="collapse-btn"
                      onclick="window.toggleSectionCollapse('${secIdJs}')"
                      title="${secCollapsed ? "Expand phase" : "Collapse phase"}"
                      style="color:${escAttr(sec.color)};">${secCollapsed ? "&#9656;" : "&#9662;"}</button>
              <span style="font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; background:${escAttr(sec.bg)}; color:${escAttr(sec.color)}; flex-shrink:0;">${esc(sec.code)}</span>
              <input type="text" class="inline-text-inp"
                     value="${escAttr(sec.title)}"
                     title="Click to edit Phase title"
                     onchange="window.editPhaseInlineTitle('${secIdJs}', this.value)"
                     onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }"
                     style="font-weight:800; font-size:12.5px;" />
              <button type="button" class="row-icon-btn no-print"
                      onclick="window.addInlineTaskToSection('${secIdJs}')"
                      style="border-color:${escAttr(sec.color)}; color:${escAttr(sec.color)};">+ Task</button>
            </div>
            <div class="gantt-cell">
              <span class="health-pill ${secHealth.cls}" style="font-size:9.5px; padding:2px 7px;">${esc(secHealth.label)}</span>
            </div>
            <div class="gantt-cell mono-num" style="color:var(--muni-muted); font-size:10.5px;">${minS ? esc(minS) : "—"}</div>
            <div class="gantt-cell mono-num" style="color:var(--muni-muted); font-size:10.5px;">${maxE ? esc(maxE) : "—"}</div>
            <div class="gantt-cell mono-num" style="color:${escAttr(sec.color)};">${secPct}% (${secDoneTasks}/${secTasks.length})</div>
          </div>
          <div class="gantt-track" style="grid-template-columns:repeat(${totalDays}, 1fr); min-height:35px; background:#F8FAFC;">
            ${days.map(d => `<div class="gantt-day-bg ${d.isWeekend ? "weekend" : ""} ${d.isMonday ? "week-start" : ""}"></div>`).join("")}
            ${todayPct >= 0 ? `<div class="gantt-today-line" style="left:${todayPct}%;"></div>` : ""}
            ${secGeom && !secGeom.outLeft && !secGeom.outRight ? `
              <div style="position:absolute; left:calc(${secGeom.leftPct}% + 2px); width:calc(${secGeom.widthPct}% - 4px); height:8px; border-radius:999px; background:rgba(20,21,25,0.10); overflow:hidden; z-index:3;"
                   title="${escAttr(sec.title)}: ${secPct}% complete (${minS} to ${maxE})">
                <div style="width:${secPct}%; height:100%; background:${escAttr(sec.color)};"></div>
              </div>
            ` : ""}
          </div>
        </div>
      `;

      if (secCollapsed) return secHeaderRow;

      const taskRowsHtml = secTasks.length === 0
        ? `<div style="padding:10px 16px; font-size:12px; color:var(--muni-muted); border-bottom:1px solid var(--muni-border);">No matching tasks in this phase.</div>`
        : secTasks.map(t => {
            const m = computeTaskMetrics(t, todayIso);
            const mem = getMember(t.owner);
            const geom = computeBarGeom(t.start_date, t.end_date, days);
            const pal = resolveBarPalette(t, sec, mem);
            const tIdJs = escJs(t.id);
            const tIdAttr = escAttr(t.id);
            const subs = t.subtasks || [];
            const taskCollapsed = Boolean(ui.collapsedTasks[t.id]);

            const subRows = taskCollapsed ? "" : subs.map(st => {
              normalizeSubtask(st, t);
              const sGeom = computeBarGeom(st.start_date, st.end_date, days);
              const sMem = getMember(st.owner || t.owner);
              const sPct = st.progress_pct;
              const stIdJs = escJs(st.id);
              const stIdAttr = escAttr(st.id);
              const sOverdue = sPct < 100 && Boolean(st.end_date && st.end_date < todayIso);

              return `
                <div class="gantt-sub-row" style="grid-template-columns:${gridTemplate};">
                  <div class="gantt-left-cols">
                    <div class="gantt-cell" style="padding-left:26px; display:flex; align-items:center; gap:5px;">
                      <span style="color:var(--muni-orange); font-weight:800; font-size:10px; flex-shrink:0;">&#9584;&#9472;&#9658;</span>
                      <input type="checkbox" ${sPct >= 100 ? "checked" : ""}
                             onchange="window.toggleSubtaskDone('${tIdJs}', '${stIdJs}', this.checked)"
                             title="Mark subtask 100% done"
                             style="accent-color:var(--muni-orange); cursor:pointer; flex-shrink:0;" />
                      <input id="sub-title-inp-${stIdAttr}" type="text"
                             class="inline-text-inp sub ${sPct >= 100 ? "done-strike" : ""}"
                             value="${escAttr(st.title)}"
                             placeholder="Subtask name..."
                             title="${escAttr(st.title)}"
                             oninput="window.livePreviewSubtaskTitle('${stIdJs}', this.value)"
                             onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'title', this.value)"
                             onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }" />
                      <button type="button" class="sub-del-btn no-print"
                              onclick="window.deleteSubtaskInline('${tIdJs}', '${stIdJs}')"
                              title="Delete subtask">&#10005;</button>
                    </div>

                    <div class="gantt-cell">
                      <select class="inline-member-sel" style="color:${escAttr(sMem.color)};"
                              onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'owner', this.value)"
                              title="Subtask assignee">
                        ${members.map(mm => `<option value="${escAttr(mm.id)}" ${mm.id === (st.owner || t.owner) ? "selected" : ""}>${esc(mm.initials)} ${esc(mm.name)}</option>`).join("")}
                      </select>
                    </div>

                    <div class="gantt-cell">
                      <input id="gantt-start-${stIdAttr}" type="date" class="inline-date-inp"
                             value="${escAttr(st.start_date)}"
                             title="Subtask Start Date"
                             onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'start_date', this.value)" />
                    </div>

                    <div class="gantt-cell">
                      <input id="gantt-end-${stIdAttr}" type="date" class="inline-date-inp ${sOverdue ? "overdue" : ""}"
                             value="${escAttr(st.end_date)}"
                             title="Subtask End Date"
                             onchange="window.updateSubtaskField('${tIdJs}', '${stIdJs}', 'end_date', this.value)" />
                    </div>

                    <div class="gantt-cell" style="display:flex; align-items:center; gap:4px;">
                      <input id="sub-slider-${stIdAttr}" type="range" min="0" max="100" step="5" value="${sPct}"
                             class="prog-slider no-print"
                             style="background:linear-gradient(to right, ${sPct >= 80 ? "#0F9D58" : sMem.color} ${sPct}%, #E2E8F0 ${sPct}%);"
                             oninput="window.livePreviewPct('${stIdJs}', this.value, '${escJs(sMem.color)}', true)"
                             onchange="window.setSubtaskProgress('${tIdJs}', '${stIdJs}', this.value)"
                             title="Subtask % complete" />
                      <input id="pct-num-${stIdAttr}" type="number" min="0" max="100" value="${sPct}"
                             class="inline-pct-num"
                             onchange="window.setSubtaskProgress('${tIdJs}', '${stIdJs}', this.value)"
                             title="Type subtask % (0-100)" />
                      <span style="font-size:10px; font-weight:800; color:var(--muni-muted);">%</span>
                    </div>
                  </div>

                  <div class="gantt-track" style="grid-template-columns:repeat(${totalDays}, 1fr);">
                    ${days.map(d => `<div class="gantt-day-bg ${d.isWeekend ? "weekend" : ""} ${d.isMonday ? "week-start" : ""}"></div>`).join("")}
                    ${todayPct >= 0 ? `<div class="gantt-today-line" style="left:${todayPct}%; opacity:0.45;"></div>` : ""}
                    ${!sGeom.outLeft && !sGeom.outRight ? `
                      <div id="gantt-bar-${stIdAttr}" class="gantt-bubble sub"
                           onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '${stIdJs}', 'MOVE', ${sGeom.clampedStart}, ${sGeom.clampedEnd})"
                           title="Drag to reschedule subtask • Drag edges to resize (${escAttr(st.title)} — ${sPct}%)"
                           style="left:calc(${sGeom.leftPct}% + 3px); width:calc(${sGeom.widthPct}% - 6px); background:#FFF; border:1.5px solid ${escAttr(sMem.color)};">
                        <div class="gantt-grip left" onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '${stIdJs}', 'LEFT', ${sGeom.clampedStart}, ${sGeom.clampedEnd})"></div>
                        <div id="gantt-fill-${stIdAttr}" class="gantt-bubble-fill" style="width:${sPct}%; background:${escAttr(sMem.color)};"></div>
                        <span id="gantt-bar-lbl-${stIdAttr}" class="gantt-bubble-lbl" style="color:${escAttr(sMem.color)}; font-size:9.5px;">&#8627; ${esc(st.title)} (${sPct}%)</span>
                        <div class="gantt-grip right" onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '${stIdJs}', 'RIGHT', ${sGeom.clampedStart}, ${sGeom.clampedEnd})"></div>
                      </div>
                    ` : ""}
                  </div>
                </div>
              `;
            }).join("");

            return `
              <div class="gantt-task-row" style="grid-template-columns:${gridTemplate};">
                <div class="gantt-left-cols">
                  <div class="gantt-cell" style="display:flex; align-items:center; gap:5px;">
                    ${subs.length > 0 ? `
                      <button type="button" class="collapse-btn"
                              onclick="window.toggleTaskCollapse('${tIdJs}', event)"
                              title="${taskCollapsed ? `Expand ${subs.length} subtask(s)` : `Collapse ${subs.length} subtask(s)`}">
                        ${taskCollapsed ? "&#9656;" : "&#9662;"}
                      </button>
                    ` : `<span style="width:18px; flex-shrink:0;"></span>`}

                    <span onclick="window.toggleStarTask('${tIdJs}', event)"
                          style="cursor:pointer; color:${t.starred ? "var(--muni-orange)" : "#CBD5E1"}; font-size:13px; flex-shrink:0;"
                          title="Star key roadshow milestone">${t.starred ? "&#9733;" : "&#9734;"}</span>

                    <input id="task-title-inp-${tIdAttr}" type="text"
                           class="inline-text-inp ${m.isDone ? "done-strike" : ""}"
                           value="${escAttr(t.title)}"
                           placeholder="Task name..."
                           title="${escAttr(t.title)}"
                           oninput="window.livePreviewTaskTitle('${tIdJs}', this.value, ${m.pct})"
                           onchange="window.updateTaskField('${tIdJs}', 'title', this.value)"
                           onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }" />

                    ${taskCollapsed && subs.length > 0 ? `
                      <button type="button" class="row-icon-btn"
                              onclick="window.toggleTaskCollapse('${tIdJs}', event)"
                              title="Click to expand ${subs.length} hidden subtask(s)"
                              style="background:#F1F5F9; color:#334155;">&#8627;${subs.length}</button>
                    ` : ""}

                    <button type="button" class="row-icon-btn no-print"
                            onclick="window.addInlineSubtask('${tIdJs}', event)"
                            title="Add subtask right below this task"
                            style="border-color:rgba(240,83,50,0.32); color:var(--muni-orange);">+&#8627;</button>

                    <button type="button" class="row-icon-btn no-print"
                            onclick="window.openTaskDrawer('${tIdJs}')"
                            title="Open full task drawer (deliverables, notes, priority, duplicate, delete)">&#8599;</button>
                  </div>

                  <div class="gantt-cell">
                    <select class="inline-member-sel" style="color:${escAttr(mem.color)};"
                            onchange="window.updateTaskField('${tIdJs}', 'owner', this.value)"
                            title="Task assignee">
                      ${members.map(mm => `<option value="${escAttr(mm.id)}" ${mm.id === t.owner ? "selected" : ""}>${esc(mm.initials)} ${esc(mm.name)}</option>`).join("")}
                    </select>
                  </div>

                  <div class="gantt-cell">
                    <input id="gantt-start-${tIdAttr}" type="date" class="inline-date-inp"
                           value="${escAttr(t.start_date)}"
                           title="Task Start Date"
                           onchange="window.updateTaskField('${tIdJs}', 'start_date', this.value)" />
                  </div>

                  <div class="gantt-cell">
                    <input id="gantt-end-${tIdAttr}" type="date" class="inline-date-inp ${m.isOverdue ? "overdue" : ""}"
                           value="${escAttr(t.end_date)}"
                           title="${m.isOverdue ? "Overdue — click to update End Date" : "Task End Date"}"
                           onchange="window.updateTaskField('${tIdJs}', 'end_date', this.value)" />
                  </div>

                  <div class="gantt-cell" style="display:flex; align-items:center; gap:4px;">
                    <input id="task-slider-${tIdAttr}" type="range" min="0" max="100" step="5" value="${m.pct}"
                           class="prog-slider no-print"
                           style="background:linear-gradient(to right, ${m.pct >= 80 ? "#0F9D58" : "#2563EB"} ${m.pct}%, #E2E8F0 ${m.pct}%);"
                           oninput="window.livePreviewPct('${tIdJs}', this.value, '${escJs(pal.border)}', false)"
                           onchange="window.setTaskProgress('${tIdJs}', this.value)"
                           title="Drag to update % complete" />
                    <input id="pct-num-${tIdAttr}" type="number" min="0" max="100" value="${m.pct}"
                           class="inline-pct-num"
                           onchange="window.setTaskProgress('${tIdJs}', this.value)"
                           title="Type % complete (0-100)" />
                    <span style="font-size:10px; font-weight:800; color:var(--muni-muted);">%</span>
                  </div>
                </div>

                <div class="gantt-track" style="grid-template-columns:repeat(${totalDays}, 1fr);">
                  ${days.map(d => `<div class="gantt-day-bg ${d.isWeekend ? "weekend" : ""} ${d.isMonday ? "week-start" : ""}"></div>`).join("")}
                  ${todayPct >= 0 ? `<div class="gantt-today-line" style="left:${todayPct}%;"></div>` : ""}
                  ${geom.outLeft ? `
                    <button type="button" onclick="window.jumpTimelineTo('${escJs(t.start_date)}')"
                            style="position:absolute; left:6px; z-index:6; border:1px solid var(--muni-border-strong); background:#FFF; border-radius:999px; font-size:10px; font-weight:800; padding:2px 8px; cursor:pointer;">&larr; ${esc(t.start_date.slice(5))}</button>
                  ` : (geom.outRight ? `
                    <button type="button" onclick="window.jumpTimelineTo('${escJs(t.start_date)}')"
                            style="position:absolute; right:6px; z-index:6; border:1px solid var(--muni-border-strong); background:#FFF; border-radius:999px; font-size:10px; font-weight:800; padding:2px 8px; cursor:pointer;">${esc(t.start_date.slice(5))} &rarr;</button>
                  ` : `
                    <div id="gantt-bar-${tIdAttr}" class="gantt-bubble"
                         onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '', 'MOVE', ${geom.clampedStart}, ${geom.clampedEnd})"
                         ondblclick="window.openTaskDrawer('${tIdJs}')"
                         title="Drag bar to move • Drag left/right edges to resize dates • Double-click for details (${escAttr(t.title)} — ${m.pct}%)"
                         style="left:calc(${geom.leftPct}% + 2px); width:calc(${geom.widthPct}% - 4px); background:${escAttr(pal.bg)}; border:1.5px solid ${escAttr(pal.border)};">
                      <div class="gantt-grip left" title="Drag left edge to adjust Start Date" onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '', 'LEFT', ${geom.clampedStart}, ${geom.clampedEnd})"></div>
                      <div id="gantt-fill-${tIdAttr}" class="gantt-bubble-fill" style="width:${m.pct}%; background:${escAttr(pal.border)};"></div>
                      <span id="gantt-bar-lbl-${tIdAttr}" class="gantt-bubble-lbl" style="color:${escAttr(pal.text)};">${esc(t.title)} (${m.pct}%)</span>
                      <div class="gantt-grip right" title="Drag right edge to adjust End Date" onmousedown="if(event.button===0) window.startGanttDrag(event, '${tIdJs}', '', 'RIGHT', ${geom.clampedStart}, ${geom.clampedEnd})"></div>
                    </div>
                  `)}
                </div>
              </div>
              ${subRows}
            `;
          }).join("");

      return secHeaderRow + taskRowsHtml;
    }).join("");

    return `
      <div id="ganttWrapRoot" class="gantt-wrap" style="--task-col-w:${ui.taskColWidth}px;">
        <div class="gantt-minwidth">
          <!-- Full-Height Draggable Column Resize Rail on Right Edge of Task Column -->
          <div class="col-resize-rail no-print"
               title="Drag horizontally to widen or narrow Task &amp; Subtasks column (double-click to reset)"
               onmousedown="window.startTaskColResize(event)"
               ondblclick="window.resetTaskColWidth()"></div>

          <!-- Tier 1 Header: MuniLM Schedule Group + WEEK 1..N Band -->
          <div class="gantt-hdr-top" style="grid-template-columns:${gridTemplate}; border-bottom:1px solid var(--muni-border);">
            <div class="gantt-left-cols" style="background:#F1F5F9;">
              <div class="gantt-cell gantt-hdr-cell" style="grid-column:1 / -1; background:#F1F5F9; display:flex; justify-content:space-between; align-items:center;">
                <span>MUNILM LAUNCH SCHEDULE &amp; MILESTONE ROLLUP</span>
                <span style="color:var(--muni-orange); font-size:9.5px;">&#8596; DRAG COLUMN DIVIDER OR GANTT BARS</span>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(${totalDays}, 1fr); background:#F1F5F9;">
              ${weeks.map(w => `
                <div style="grid-column:span ${w.span}; padding:5px 4px; text-align:center; font-size:9.5px; font-weight:800; letter-spacing:0.05em; color:var(--muni-charcoal); border-left:1px solid rgba(20,21,25,0.10); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
                  ${esc(w.label)}
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Tier 2 Header: Column Titles + Daily Cells -->
          <div class="gantt-hdr-days" style="grid-template-columns:${gridTemplate}; border-bottom:1.5px solid var(--muni-border-strong);">
            <div class="gantt-left-cols" style="background:#F8FAFC;">
              <div class="gantt-cell gantt-hdr-cell" style="display:flex; align-items:center; justify-content:space-between;">
                <span>Task &amp; Connected Subtasks</span>
                <span style="font-size:9px; color:var(--muni-muted); font-weight:700;">&#8596; Resize</span>
                <div class="col-resize-grip no-print"
                     title="Drag horizontally to expand or shrink column (double-click to reset)"
                     onmousedown="window.startTaskColResize(event)"
                     ondblclick="window.resetTaskColWidth()"></div>
              </div>
              <div class="gantt-cell gantt-hdr-cell">Member</div>
              <div class="gantt-cell gantt-hdr-cell">Start</div>
              <div class="gantt-cell gantt-hdr-cell">End</div>
              <div class="gantt-cell gantt-hdr-cell">% Done</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(${totalDays}, 1fr); background:#F8FAFC;">
              ${days.map(d => `
                <div style="padding:4px 1px; text-align:center; border-right:1px solid rgba(20,21,25,0.045); ${d.isMonday ? "border-left:1px solid rgba(20,21,25,0.11);" : ""} background:${d.isToday ? "rgba(240,83,50,0.14)" : (d.isWeekend ? "#EEF2F6" : "transparent")};"
                     title="${escAttr(d.iso)}">
                  ${!denseDays ? `<div style="font-size:8.5px; font-weight:700; color:${d.isToday ? "var(--muni-orange)" : "var(--muni-muted)"};">${esc(d.weekdayNarrow)}</div>` : ""}
                  <div style="font-size:${denseDays ? "9px" : "10.5px"}; font-weight:800; color:${d.isToday ? "var(--muni-orange)" : "var(--muni-ink)"};">${ denseDays && !d.isMonday && !d.isToday ? "" : d.dayNum }</div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Body Sections, Collapsible Tasks & Draggable Bars -->
          <div>${sectionsHtml}</div>
        </div>
      </div>
    `;
  }

  // --- Horizontal Drag Resizer for Task & Connected Subtasks Column ---
  window.startTaskColResize = function(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    const wrap = document.getElementById("ganttWrapRoot");
    if (!wrap) return;
    const startX = ev.clientX;
    const initW = ui.taskColWidth || DEFAULT_TASK_COL_WIDTH;
    wrap.classList.add("resizing-col");
    document.body.style.cursor = "col-resize";

    const onMove = (me) => {
      const nextW = Math.max(MIN_TASK_COL_WIDTH, Math.min(MAX_TASK_COL_WIDTH, Math.round(initW + (me.clientX - startX))));
      ui.taskColWidth = nextW;
      wrap.style.setProperty("--task-col-w", nextW + "px");
    };

    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      wrap.classList.remove("resizing-col");
      document.body.style.cursor = "";
      saveUiPrefs();
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);

  // --- Interactive Gantt Bar Drag & Edge-Resize ---
  window.startGanttDrag = function(ev, taskId, subtaskId, mode, initStartIdx, initEndIdx) {
    ev.stopPropagation();
    ev.preventDefault();
    const days = window._launchTimelineDays || [];
    const total = days.length;
    if (!total) return;

    const domId = subtaskId || taskId;
    const barEl = document.getElementById("gantt-bar-" + domId);
    if (!barEl) return;
    const trackEl = barEl.closest(".gantt-track");
    if (!trackEl) return;

    const rect = trackEl.getBoundingClientRect();
    const dayIdxAt = (clientX) => {
      const rel = clientX - rect.left;
      return Math.max(0, Math.min(total - 1, Math.floor((rel / Math.max(1, rect.width)) * total)));
    };

    const grabIdx = dayIdxAt(ev.clientX);
    const span = Math.max(0, initEndIdx - initStartIdx);
    let curS = initStartIdx;
    let curE = initEndIdx;
    let moved = false;

    barEl.style.boxShadow = "0 6px 18px rgba(20, 21, 25, 0.22)";
    barEl.style.zIndex = "15";

    const onMove = (me) => {
      const idx = dayIdxAt(me.clientX);
      if (mode === "LEFT") {
        curS = Math.min(idx, curE);
      } else if (mode === "RIGHT") {
        curE = Math.max(idx, curS);
      } else {
        const delta = idx - grabIdx;
        curS = Math.max(0, Math.min(total - 1 - span, initStartIdx + delta));
        curE = curS + span;
      }
      moved = true;
      const leftPct = (curS / total) * 100;
      const widthPct = Math.max(100 / total, ((curE - curS + 1) / total) * 100);
      barEl.style.left = `calc(${leftPct}% + 2px)`;
      barEl.style.width = `calc(${widthPct}% - 4px)`;
      const sInp = document.getElementById("gantt-start-" + domId);
      const eInp = document.getElementById("gantt-end-" + domId);
      if (sInp && days[curS]) sInp.value = days[curS].iso;
      if (eInp && days[curE]) eInp.value = days[curE].iso;
    };

    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      barEl.style.boxShadow = "";
      barEl.style.zIndex = "5";
      if (!moved || !days[curS] || !days[curE]) return;

      const t = (appState.tasks || []).find(x => x.id === taskId);
      if (!t) return;
      if (subtaskId) {
        const st = (t.subtasks || []).find(s => s.id === subtaskId);
        if (st) {
          st.start_date = days[curS].iso;
          st.end_date = days[curE].iso;
        }
      } else {
        t.start_date = days[curS].iso;
        t.end_date = days[curE].iso;
      }
      scheduleSaveState("Updated schedule dates");
      renderApp();
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // --- Toolbar, Collapse & Inline Editing Actions ---

  window.setGanttZoom = function(z) { ui.zoomMode = z; ui.panOffsetDays = 0; renderApp(); };
  window.panGantt = function(delta) { ui.panOffsetDays = delta === 0 ? 0 : ui.panOffsetDays + delta; renderApp(); };
  window.jumpTimelineTo = function(iso) {
    ui.panOffsetDays = diffCalendarDays(todayIsoStr(), iso) + 2;
    renderApp();
  };
  window.setGanttColorBy = function(mode) { ui.colorBy = mode; renderApp(); };
  window.setPhaseFilter = function(secId) { ui.phaseFilter = secId; renderApp(); };
  window.setOwnerFilter = function(own) { ui.ownerFilter = own; renderApp(); };
  window.toggleOwnerTileFilter = function(key) {
    ui.ownerFilter = ui.ownerFilter === key ? "ALL" : key;
    renderApp();
  };
  window.clearAllFilters = function() {
    ui.ownerFilter = "ALL";
    ui.phaseFilter = "ALL";
    ui.searchQuery = "";
    renderApp();
  };
  window.onLaunchSearch = function(q) {
    ui.searchQuery = q || "";
    renderApp();
    const inp = document.querySelector('input[type="search"]');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  };

  window.toggleSectionCollapse = function(secId) {
    ui.collapsedSections[secId] = !ui.collapsedSections[secId];
    renderApp();
  };
  window.expandCollapseAllPhases = function(collapse) {
    ui.collapsedSections = {};
    if (collapse) {
      for (const s of (appState.sections || [])) ui.collapsedSections[s.id] = true;
    }
    renderApp();
  };

  window.toggleTaskCollapse = function(taskId, ev) {
    if (ev) ev.stopPropagation();
    ui.collapsedTasks[taskId] = !ui.collapsedTasks[taskId];
    renderApp();
  };
  window.expandCollapseAllTasks = function(collapse) {
    ui.collapsedTasks = {};
    if (collapse) {
      for (const t of (appState.tasks || [])) {
        if ((t.subtasks || []).length > 0) ui.collapsedTasks[t.id] = true;
      }
    }
    renderApp();
  };

  window.sortLaunchTable = function(field) {
    if (ui.tableSortField === field) {
      ui.tableSortDir = ui.tableSortDir === "asc" ? "desc" : "asc";
    } else {
      ui.tableSortField = field;
      ui.tableSortDir = "asc";
    }
    renderApp();
  };

  window.editPhaseInlineTitle = function(secId, val) {
    const s = (appState.sections || []).find(x => x.id === secId);
    const clean = (val || "").trim();
    if (!s || !clean) { renderApp(); return; }
    s.title = clean;
    scheduleSaveState("Updated phase title");
    renderApp();
  };

  window.addInlineTaskToSection = function(secId) {
    const sIso = todayIsoStr();
    const newTask = normalizeTask({
      id: "tsk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
      section_id: secId,
      title: "New Launch Task",
      owner: (appState.team_members[0] && appState.team_members[0].id) || "both",
      status: "Todo",
      priority: 4,
      progress_pct: 0,
      start_date: sIso,
      end_date: addDaysIso(sIso, 5),
      starred: false,
      deliverable: "",
      links: [],
      subtasks: []
    });
    appState.tasks.push(newTask);
    delete ui.collapsedSections[secId];
    scheduleSaveState("Added task");
    renderApp();
    setTimeout(() => {
      const inp = document.getElementById("task-title-inp-" + newTask.id);
      if (inp) { inp.focus(); inp.select(); }
    }, 40);
  };

  window.toggleStarTask = function(taskId, ev) {
    if (ev) ev.stopPropagation();
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    t.starred = !t.starred;
    scheduleSaveState();
    renderApp();
  };

  window.setTaskProgress = function(taskId, val) {
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    const n = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
    t.progress_pct = n;
    if (n === 100) t.status = "Done";
    else if (n > 0 && t.status === "Todo") t.status = "Doing";
    else if (n < 100 && t.status === "Done") t.status = "Doing";
    scheduleSaveState();
    renderApp();
  };

  window.setTaskStatus = function(taskId, statusVal) {
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t || !STATUS_LIST.includes(statusVal)) return;
    t.status = statusVal;
    if (statusVal === "Done") t.progress_pct = 100;
    else if (statusVal === "Todo" && t.progress_pct === 100) t.progress_pct = 0;
    else if (statusVal === "Doing" && t.progress_pct === 0) t.progress_pct = 25;
    scheduleSaveState();
    renderApp();
  };

  window.updateTaskField = function(taskId, field, value) {
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    if (field === "title") {
      const clean = String(value || "").trim();
      if (!clean) { renderApp(); return; }
      t.title = clean;
    } else {
      t[field] = value;
      if (field === "start_date" && t.end_date < t.start_date) t.end_date = t.start_date;
      if (field === "end_date" && t.end_date < t.start_date) t.start_date = t.end_date;
    }
    normalizeTask(t);
    scheduleSaveState();
    renderApp();
  };

  // --- Inline Subtask Actions (Full Field + Percentage Editing) ---

    if (ev) ev.stopPropagation();
    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
    const newSub = normalizeSubtask({
      id: "sub_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
      title: "New Subtask",
      owner: t.owner,
      start_date: t.start_date,
      end_date: t.end_date,
      progress_pct: 0,
      done: false
    }, t);
    t.subtasks.push(newSub);
    delete ui.collapsedTasks[taskId];
    scheduleSaveState("Added subtask");
    renderApp();
    setTimeout(() => {
      const inp = document.getElementById("sub-title-inp-" + newSub.id);
      if (inp) { inp.focus(); inp.select(); }
    }, 40);

  window.toggleSubtaskDone = function(taskId, subId, checked) {
    window.setSubtaskProgress(taskId, subId, checked ? 100 : 0);

    const t = (appState.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    const st = (t.subtasks || []).find(s => s.id === subId);
    if (!st) return;
    const n = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
    st.progress_pct = n;
    st.done = n >= 100;
    scheduleSaveState();
    renderApp();
  };

  window.updateSubtaskField = function(taskId, subId, field, value) {

    if (!t) return;
    const st = (t.subtasks || []).find(s => s.id === subId);
    if (!st) return;
    if (field === "title") {
      const clean = String(value || "").trim();
      if (!clean) { renderApp(); return; }
      st.title = clean;
    } else {
      st[field] = value;
      if (field === "start_date" && st.end_date < st.start_date) st.end_date = st.start_date;
      if (field === "end_date" && st.end_date < st.start_date) st.start_date = st.end_date;
    }
    normalizeSubtask(st, t);
    scheduleSaveState();
    renderApp();

  window.deleteSubtaskInline = function(taskId, subId) {

  window.quickAddTask = function() {
    const titleEl = document.getElementById("quickTaskTitle");
    const secEl = document.getElementById("quickTaskSec");
    const ownEl = document.getElementById("quickTaskOwner");
    const sEl = document.getElementById("quickTaskStart");
    const eEl = document.getElementById("quickTaskEnd");
    const title = (titleEl && titleEl.value || "").trim();
    if (!title) { if (titleEl) titleEl.focus(); return; }

    const startIso = (sEl && sEl.value) || todayIsoStr();
    const endIso = (eEl && eEl.value && eEl.value >= startIso) ? eEl.value : addDaysIso(startIso, 4);
    const newTask = normalizeTask({
      id: "tsk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6),
      section_id: (secEl && secEl.value) || appState.sections[0].id,
      title,
      owner: (ownEl && ownEl.value) || appState.team_members[0].id,
      status: "Todo",
      priority: 4,
      progress_pct: 0,
      start_date: startIso,
      end_date: endIso,
      starred: false,
      deliverable: "",
      links: [],
      subtasks: []
    });

    delete ui.collapsedSections[newTask.section_id];

  window.onKanbanDragStart = function(taskId) { ui.draggingKanbanTaskId = taskId; };

  // --- Slide-Over Task Record Drawer ---
  window.openTaskDrawer = function(taskId, defaultSecId) {
    const members = appState.team_members || [];
    const sections = appState.sections || [];
    let t = taskId ? (appState.tasks || []).find(x => x.id === taskId) : null;
    const isNew = !t;
    if (!t) {
      const sIso = todayIsoStr();
      t = normalizeTask({
        id: "tsk_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6),
        section_id: defaultSecId || (ui.phaseFilter !== "ALL" ? ui.phaseFilter : sections[0].id),
        title: "",
        owner: members[0].id,
        status: "Todo",
        priority: 4,
        progress_pct: 0,
        start_date: sIso,
        end_date: addDaysIso(sIso, 5),
        starred: false,
        deliverable: "",
        links: [],
        subtasks: []
      });
      t._isDraftNew = true;
      window._draftDrawerTask = t;
    } else {
      window._draftDrawerTask = null;

    ui.activeDrawerTaskId = t.id;
    renderTaskDrawerContent(t, isNew);
    document.getElementById("taskDrawerBackdrop").classList.add("open");

    if (window._draftDrawerTask && window._draftDrawerTask.id === ui.activeDrawerTaskId) {

  function syncDrawerInputsIntoTask(t) {
    const titleVal = (document.getElementById("drwTitle")?.value || "").trim();
    if (titleVal) t.title = titleVal;
    t.section_id = document.getElementById("drwSection")?.value || t.section_id;
    t.owner = document.getElementById("drwOwner")?.value || t.owner;
    t.status = document.getElementById("drwStatus")?.value || t.status;
    t.priority = parseInt(document.getElementById("drwPriority")?.value || "4", 10);
    t.progress_pct = parseInt(document.getElementById("drwPct")?.value || "0", 10);
    t.start_date = document.getElementById("drwStart")?.value || t.start_date;
    t.end_date = document.getElementById("drwEnd")?.value || t.start_date;
    if (t.end_date < t.start_date) t.end_date = t.start_date;
    t.deliverable = document.getElementById("drwDeliverable")?.value || "";
    if (t.status === "Done") t.progress_pct = 100;
    normalizeTask(t);
  }

  window.shiftDrawerDates = function(delta) {
    const sEl = document.getElementById("drwStart");
    const eEl = document.getElementById("drwEnd");
    if (sEl) sEl.value = addDaysIso(sEl.value, delta);
    if (eEl) eEl.value = addDaysIso(eEl.value, delta);
  };

  window.addDrawerSubtask = function() {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    const inp = document.getElementById("drawerNewSubTitle");
    const subTitle = (inp?.value || "").trim();
    if (!subTitle) { if (inp) inp.focus(); return; }
    t.subtasks.push(normalizeSubtask({
      id: "sub_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
      title: subTitle,
      owner: t.owner,
      start_date: t.start_date,
      end_date: t.end_date,
      progress_pct: 0,
      done: false
    }, t));
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.editDrawerSubtask = function(subId, field, val) {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    const st = (t.subtasks || []).find(s => s.id === subId);
    if (!st) return;
    if (field === "done") {
      st.progress_pct = val ? 100 : 0;
      st.done = Boolean(val);
    } else if (field === "progress_pct") {
      st.progress_pct = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
      st.done = st.progress_pct >= 100;
    } else {
      st[field] = val;
    }
    normalizeSubtask(st, t);
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.deleteDrawerSubtask = function(subId) {
    const t = getDrawerTargetTask();
    if (!t) return;
    syncDrawerInputsIntoTask(t);
    t.subtasks = (t.subtasks || []).filter(s => s.id !== subId);
    renderTaskDrawerContent(t, Boolean(t._isDraftNew));
  };

  window.saveTaskDrawer = function() {
    const t = getDrawerTargetTask();
    if (!t) return;
    const rawTitle = (document.getElementById("drwTitle")?.value || "").trim();
    if (!rawTitle) {
      document.getElementById("drwTitle")?.focus();
      return;
    }
    syncDrawerInputsIntoTask(t);
    if (t._isDraftNew) {
      delete t._isDraftNew;
      appState.tasks.push(t);
      window._draftDrawerTask = null;
    }
    window.closeTaskDrawer();
    scheduleSaveState("Saved task");
    renderApp();
  };

  window.duplicateDrawerTask = function() {
    const t = getDrawerTargetTask();
    if (!t || t._isDraftNew) return;
    syncDrawerInputsIntoTask(t);
    const copy = deepClone(t);
    copy.id = "tsk_" + Date.now().toString(36) + "_cp";
    copy.title = t.title + " (Copy)";
    copy.subtasks = (copy.subtasks || []).map((s, i) => ({ ...s, id: copy.id + "_s" + i }));
    appState.tasks.push(copy);
    window.closeTaskDrawer();
    scheduleSaveState("Duplicated task");
    renderApp();
  };

  window.deleteDrawerTask = function() {
    const t = getDrawerTargetTask();
    if (!t || t._isDraftNew) return;
    appState.tasks = (appState.tasks || []).filter(x => x.id !== t.id);
    window.closeTaskDrawer();
    scheduleSaveState("Deleted task");
    renderApp();
  };

  window.closeTaskDrawer = function() {
    document.getElementById("taskDrawerBackdrop").classList.remove("open");

    window._draftDrawerTask = null;
