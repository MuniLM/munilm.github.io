<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MuniLM Launch — Investor Readiness &amp; Roadshow</title>
  <link rel="icon" type="image/png" href="./assets/brand/logomark_orange.png" />
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('./assets/fonts/Figtree-VariableFont_wght.ttf') format('truetype');
      font-weight: 300 900;
      font-display: swap;
    }
    :root {
      --muni-orange: #F05332;
      --muni-orange-soft: rgba(240, 83, 50, 0.11);
      --muni-ink: #141519;
      --muni-charcoal: #272A34;
      --muni-muted: #646A7A;
      --muni-pearl: #F3F3F6;
      --muni-border: rgba(20, 21, 25, 0.085);
      --muni-border-strong: rgba(20, 21, 25, 0.15);
      --pass-green: #0F9D58;
      --pass-bg: rgba(15, 157, 88, 0.12);
      --warn-amber: #C66900;
      --warn-bg: rgba(217, 119, 6, 0.13);
      --fail-red: #DC2626;
      --fail-bg: rgba(220, 38, 38, 0.11);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--muni-pearl);
      background-image:
        radial-gradient(circle at 14% 90%, rgba(240, 83, 50, 0.11) 0%, transparent 40%),
        radial-gradient(circle at 86% 12%, rgba(37, 99, 235, 0.09) 0%, transparent 38%);
      color: var(--muni-ink);
      min-height: 100vh;
      padding: 24px 20px 72px;
    }
    .shell { max-width: 1440px; margin: 0 auto; }
    .topbar {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px -10px rgba(20, 21, 25, 0.06);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar img { height: 32px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--muni-border-strong);
      background: #FFF;
      color: var(--muni-ink);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .pill-btn:hover { border-color: var(--muni-orange); color: var(--muni-orange); }
    .pill-btn-orange {
      background: var(--muni-orange);
      color: #FFF;
      border-color: var(--muni-orange);
    }
    .pill-btn-orange:hover { background: #D94323; color: #FFF; border-color: #D94323; }
    .pill-btn-dark {
      background: var(--muni-ink);
      color: #FFF;
      border-color: var(--muni-ink);
    }
    .pill-btn-dark:hover { background: var(--muni-orange); border-color: var(--muni-orange); color: #FFF; }
    .vault-status {
      font-size: 11.5px;
      font-weight: 800;
      background: var(--pass-bg);
      color: var(--pass-green);
      padding: 6px 13px;
      border-radius: 999px;
    }
    .vault-status.locked { background: var(--muni-ink); color: #FFF; }

    /* Auth Gate */
    .auth-gate {
      max-width: 520px;
      margin: 56px auto;
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 24px;
      padding: 34px 36px;
      box-shadow: 0 20px 50px -15px rgba(20, 21, 25, 0.10);
      text-align: center;
    }
    .auth-gate.hidden { display: none; }
    .auth-gate h2 { font-size: 24px; font-weight: 800; margin: 12px 0 8px; }
    .auth-gate p { font-size: 14px; color: var(--muni-muted); line-height: 1.55; margin-bottom: 20px; }
    .auth-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--muni-border-strong);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .auth-input:focus { border-color: var(--muni-orange); }
    .hidden { display: none !important; }

    /* Hero + KPI Strip */
    .hero {
      background: linear-gradient(125deg, #FFFFFF 58%, rgba(240, 83, 50, 0.09) 100%);
      border: 1px solid var(--muni-border);
      border-radius: 22px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      box-shadow: 0 12px 34px -12px rgba(20, 21, 25, 0.05);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muni-orange);
      margin-bottom: 6px;
    }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 5px; }
    .hero p { font-size: 13.5px; color: var(--muni-muted); line-height: 1.5; max-width: 780px; }
    .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-tile {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--muni-border);
      border-radius: 16px;
      padding: 14px 16px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .kpi-tile.clickable { cursor: pointer; }
    .kpi-tile.clickable:hover { transform: translateY(-2px); border-color: var(--muni-orange); }
    .kpi-tile.active-filter { border-color: var(--muni-orange); box-shadow: 0 0 0 2px rgba(240, 83, 50, 0.16); }
    .kpi-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muni-muted); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
    .kpi-val { font-size: 22px; font-weight: 800; color: var(--muni-ink); margin-bottom: 3px; display: flex; align-items: baseline; gap: 8px; }
    .kpi-sub { font-size: 11.5px; color: var(--muni-muted); line-height: 1.35; }
    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .health-on-track { background: var(--pass-bg); color: var(--pass-green); }
    .health-at-risk { background: var(--warn-bg); color: var(--warn-amber); }
    .health-off-track { background: var(--fail-bg); color: var(--fail-red); }

    /* Command Card & Controls */
    .command-card {
      background: #FFFFFF;
      border: 1px solid var(--muni-border);
      border-radius: 22px;
      padding: 18px 20px;
      box-shadow: 0 14px 38px -14px rgba(20, 21, 25, 0.06);
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 11px;
      margin-bottom: 11px;
      border-bottom: 1px solid var(--muni-border);
    }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cluster-chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--muni-border);
      background: #F8FAFC;
      color: var(--muni-charcoal);
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .cluster-chip:hover { border-color: rgba(240, 83, 50, 0.4); }
    .cluster-chip.active {
      background: var(--muni-ink);
      color: #FFF;
      border-color: var(--muni-ink);
    }
    .filter-pill {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--muni-border);
      background: #FFF;
      color: var(--muni-charcoal);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .filter-pill.active {
      background: var(--muni-orange-soft);
      color: var(--muni-orange);
      border-color: rgba(240, 83, 50, 0.45);
      font-weight: 800;
    }
    .avatar-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #FFF;
      font-size: 9px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .quick-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .inp, .sel {
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--muni-border-strong);
      background: #FFF;
      color: var(--muni-ink);
      outline: none;
    }
    .inp:focus, .sel:focus { border-color: var(--muni-orange); }

    /* MuniLM Gantt Container & Resizable Task Column */
    .gantt-wrap {
      --task-col-w: 400px;
      --meta-cols-w: 404px; /* 78 (Member) + 108 (Start) + 108 (End) + 110 (% Done) */
      border: 1px solid var(--muni-border-strong);
      border-radius: 16px;
      overflow-x: auto;
      background: #FFF;
      position: relative;
    }
    .gantt-wrap.meta-collapsed {
      --meta-cols-w: 0px;
    }
    .gantt-minwidth {
      min-width: 1020px;
      position: relative;
    }
    .gantt-wrap.meta-collapsed .gantt-minwidth {
      min-width: 760px;
    }
    .gantt-hdr-top, .gantt-hdr-days, .gantt-sec-row, .gantt-task-row, .gantt-sub-row {
      display: grid;
      align-items: stretch;
    }
    .gantt-left-cols {
      display: grid;
      grid-template-columns: var(--task-col-w) 78px 108px 108px 110px;
      align-items: center;
      border-right: 1.5px solid var(--muni-border-strong);
      background: inherit;
    }
    .gantt-wrap.meta-collapsed .gantt-left-cols {
      grid-template-columns: var(--task-col-w);
    }
    .gantt-wrap.meta-collapsed .gantt-meta-cell {
      display: none !important;
    }
    .gantt-cell {
      padding: 5px 7px;
      font-size: 11.5px;
      border-right: 1px solid rgba(20, 21, 25, 0.055);
      overflow: hidden;
      min-width: 0;
      position: relative;
    }
    .gantt-cell:last-child { border-right: none; }
    .gantt-hdr-cell {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muni-muted);
      padding: 8px 8px;
      background: #F8FAFC;
      white-space: nowrap;
    }

    /* Draggable Column Resizer Handle & Full-Height Rail */
    .col-resize-grip {
      position: absolute;
      top: 0;
      right: -4px;
      bottom: 0;
      width: 9px;
      cursor: col-resize;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .col-resize-grip::after {
      content: "";
      width: 3px;
      height: 16px;
      border-left: 1px solid #94A3B8;
      border-right: 1px solid #94A3B8;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .col-resize-grip:hover::after,
    .gantt-wrap.resizing-col .col-resize-grip::after {
      border-color: var(--muni-orange);
      background: var(--muni-orange);
    }
    .col-resize-rail {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--task-col-w) - 3px);
      width: 7px;
      cursor: col-resize;
      z-index: 18;
      background: transparent;
      transition: background 0.12s ease;
    }
    .col-resize-rail:hover,
    .gantt-wrap.resizing-col .col-resize-rail {
      background: rgba(240, 83, 50, 0.35);
    }

    /* Row Styles & Inline Editable Inputs */
    .gantt-sec-row {
      background: #F8FAFC;
      border-top: 1px solid var(--muni-border-strong);
      border-bottom: 1px solid var(--muni-border);
      font-weight: 800;
    }
    .gantt-task-bundle {
      position: relative;
      transition: opacity 0.12s ease;
    }
    .gantt-task-bundle.dragging-bundle {
      opacity: 0.42;
    }
    .gantt-task-bundle.drop-before::before {
      content: "";
      position: absolute;
      top: -1.5px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--muni-orange);
      z-index: 26;
      pointer-events: none;
    }
    .gantt-task-bundle.drop-after::after {
      content: "";
      position: absolute;
      bottom: -1.5px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--muni-orange);
      z-index: 26;
      pointer-events: none;
    }
    .task-drag-handle {
      cursor: grab;
      color: #94A3B8;
      font-size: 13px;
      line-height: 1;
      padding: 2px 3px;
      border-radius: 4px;
      user-select: none;
      flex-shrink: 0;
      transition: color 0.12s ease, background 0.12s ease;
    }
    .task-drag-handle:hover {
      color: var(--muni-orange);
      background: rgba(240, 83, 50, 0.10);
    }
    .task-drag-handle:active {
      cursor: grabbing;
    }

    .gantt-task-row {
      background: #FFFFFF;
      border-bottom: 1px solid rgba(20, 21, 25, 0.055);
      transition: background 0.1s ease;
    }
    .gantt-task-row:hover { background: #F9FAFB; }
    .gantt-sub-row {
      background: #FCFCFD;
      border-bottom: 1px dashed rgba(20, 21, 25, 0.055);
    }
    .gantt-sub-row:hover { background: #F4F6FA; }

    .collapse-btn {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muni-muted);
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .collapse-btn:hover {
      background: rgba(20, 21, 25, 0.07);
      color: var(--muni-ink);
    }

    .inline-text-inp {
      width: 100%;
      min-width: 0;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muni-ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 5px;
      outline: none;
      text-overflow: ellipsis;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .inline-text-inp:hover {
      border-color: rgba(20, 21, 25, 0.13);
      background: #FFF;
    }
    .inline-text-inp:focus {
      border-color: var(--muni-orange);
      background: #FFF;
      box-shadow: 0 0 0 2px rgba(240, 83, 50, 0.12);
    }
    .inline-text-inp.sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muni-charcoal);
    }
    .inline-text-inp.done-strike {
      text-decoration: line-through;
      color: var(--muni-muted);
    }

    .inline-member-sel {
      width: 100%;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 4px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      outline: none;
    }
    .inline-member-sel:hover, .inline-member-sel:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }

    .inline-date-inp {
      width: 100%;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muni-charcoal);
      padding: 3px 4px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      outline: none;
      cursor: pointer;
    }
    .inline-date-inp:hover, .inline-date-inp:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }
    .inline-date-inp.overdue {
      color: var(--fail-red);
      font-weight: 800;
    }

    .inline-pct-num {
      width: 38px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 800;
      text-align: right;
      color: var(--muni-ink);
      padding: 2px 3px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      outline: none;
      -moz-appearance: textfield;
    }
    .inline-pct-num::-webkit-outer-spin-button,
    .inline-pct-num::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .inline-pct-num:hover, .inline-pct-num:focus {
      border-color: var(--muni-border-strong);
      background: #FFF;
    }

    .row-icon-btn {
      border: 1px solid rgba(20, 21, 25, 0.14);
      background: #FFF;
      color: var(--muni-charcoal);
      border-radius: 5px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.35;
    }
    .row-icon-btn:hover {
      border-color: var(--muni-orange);
      color: var(--muni-orange);
    }
    .sub-del-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--fail-red);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 3px;
      transition: opacity 0.12s ease;
    }
    .gantt-sub-row:hover .sub-del-btn,
    .gantt-sub-row:focus-within .sub-del-btn { opacity: 0.85; }
    .sub-del-btn:hover { opacity: 1 !important; }

    /* Gantt Timeline Track & Draggable Bubbles */
    .gantt-track {
      position: relative;
      display: grid;
      align-items: center;
      min-height: 39px;
      user-select: none;
    }
    .gantt-sub-row .gantt-track { min-height: 33px; }
    .gantt-day-bg {
      height: 100%;
      border-right: 1px solid rgba(20, 21, 25, 0.04);
    }
    .gantt-day-bg.weekend { background: rgba(241, 245, 249, 0.68); }
    .gantt-day-bg.week-start { border-left: 1px solid rgba(20, 21, 25, 0.11); }
    .gantt-today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--muni-orange);
      z-index: 4;
      pointer-events: none;
      opacity: 0.8;
    }
    .gantt-bubble {
      position: absolute;
      height: 24px;
      border-radius: 7px;
      z-index: 5;
      display: flex;
      align-items: center;
      padding: 0 10px;
      cursor: grab;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(20, 21, 25, 0.08);
      transition: box-shadow 0.12s ease;
    }
    .gantt-bubble:active { cursor: grabbing; }
    .gantt-bubble.sub {
      height: 19px;
      border-radius: 999px;
      padding: 0 9px;
    }
    .gantt-bubble-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;
      opacity: 0.24;
    }
    .gantt-bubble-lbl {
      position: relative;
      z-index: 1;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .gantt-grip {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      z-index: 6;
      cursor: ew-resize;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .gantt-grip.left { left: 0; border-right: 2px solid rgba(20, 21, 25, 0.25); }
    .gantt-grip.right { right: 0; border-left: 2px solid rgba(20, 21, 25, 0.25); }
    .gantt-bubble:hover .gantt-grip { opacity: 1; background: rgba(255, 255, 255, 0.45); }

    /* Progress Slider */
    .prog-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 48px;
      height: 5px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .prog-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #FFF;
      border: 2px solid var(--muni-ink);
      cursor: pointer;
    }
    .mono-num { font-family: var(--mono); font-size: 11px; font-weight: 700; }

    /* Table View */
    .table-wrap {
      border: 1px solid var(--muni-border-strong);
      border-radius: 16px;
      overflow-x: auto;
      background: #FFF;
    }
    table.muni-tbl { width: 100%; border-collapse: collapse; min-width: 920px; }
    table.muni-tbl th {
      text-align: left;
      padding: 10px 12px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--muni-border-strong);
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muni-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    table.muni-tbl th:hover { color: var(--muni-orange); }
    table.muni-tbl td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(20, 21, 25, 0.06);
      font-size: 12.5px;
      vertical-align: middle;
    }
    table.muni-tbl tr.tbl-row:hover { background: #F9FAFB; }
    table.muni-tbl tr.tbl-sub-row { background: #FCFCFD; }

    /* Kanban View */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(230px, 1fr));
      gap: 12px;
      overflow-x: auto;
    }
    .kanban-col {
      background: var(--muni-pearl);
      border: 1px solid var(--muni-border);
      border-radius: 16px;
      padding: 12px;
      min-height: 360px;
    }
    .kanban-col.drag-over {
      border-color: var(--muni-orange);
      background: rgba(240, 83, 50, 0.06);
    }
    .kanban-card {
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 9px;
      cursor: grab;
      box-shadow: 0 3px 8px rgba(20, 21, 25, 0.04);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .kanban-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(20, 21, 25, 0.08);
    }

    /* Slide-Over Drawer & Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 21, 25, 0.38);
      backdrop-filter: blur(3px);
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: flex-end;
    }
    .backdrop.open { display: flex; }
    .drawer {
      width: min(580px, 96vw);
      height: 100vh;
      background: #FFF;
      box-shadow: -16px 0 44px rgba(20, 21, 25, 0.18);
      padding: 24px 26px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-center { justify-content: center; }
    .modal-box {
      width: min(640px, 94vw);
      max-height: 88vh;
      background: #FFF;
      border-radius: 20px;
      padding: 24px 26px;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(20, 21, 25, 0.22);
    }
    .field-lbl {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muni-muted);
      margin-bottom: 5px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 22px;
      background: var(--muni-ink);
      color: #FFF;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      z-index: 120;
      box-shadow: 0 10px 26px rgba(20, 21, 25, 0.22);
      display: none;
    }
    .toast.show { display: block; }

    @media print {
      body { background: #FFF; padding: 0; }
      .topbar-right, .quick-bar, .no-print { display: none !important; }
      .shell { max-width: 100%; }
      .gantt-wrap { overflow: visible; }
    }
  </style>
</head>

        if (Number.isFinite(w)) {
          ui.taskColWidth = Math.max(MIN_TASK_COL_WIDTH, Math.min(MAX_TASK_COL_WIDTH, Math.round(w)));
        }
        if (typeof raw.hideMetaCols === "boolean") {
          ui.hideMetaCols = raw.hideMetaCols;
        }
      }
    } catch (_e) {}
  }

  function saveUiPrefs() {
    try {
      localStorage.setItem(
        UI_PREFS_STORAGE_KEY,
        JSON.stringify({ taskColWidth: ui.taskColWidth, hideMetaCols: ui.hideMetaCols })
      );

  }

  // --- Safe DOM Escaping Helpers ---
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function escAttr(v) { return esc(v); }
  function escJs(v) {
    return String(v == null ? "" : v)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\r/g, "")
      .replace(/\n/g, "\\n");
  }

  function showToast(msg) {
    const el = document.getElementById("launchToast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._tid);
    el._tid = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  // --- WebCrypto Helpers ---
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  async function deriveAesKey(passkey, saltBytes, iterations, usages) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(passkey.trim()),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: iterations || 210000, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      usages
    );
  }

  async function decryptEnvelope(env, passkey) {
    const key = await deriveAesKey(passkey, b64ToBytes(env.salt_b64), env.iterations || 210000, ["decrypt"]);
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(env.nonce_b64) },
      key,
      b64ToBytes(env.ciphertext_b64)
    );
    return JSON.parse(new TextDecoder("utf-8").decode(pt));
  }

  async function initSessionEncryptionKey(passkey) {
    sessionSalt = crypto.getRandomValues(new Uint8Array(16));
    sessionCryptoKey = await deriveAesKey(passkey, sessionSalt, 210000, ["encrypt"]);
  }

  function scheduleSaveState(label) {
    if (!appState) return;
    appState.updated_at = new Date().toISOString();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => persistStateNow(label), 180);
  }

  async function persistStateNow(label) {
    const ind = document.getElementById("saveIndicator");
    try {
      const payloadBytes = new TextEncoder().encode(JSON.stringify(appState));
      if (isUnencryptedLocal || !sessionCryptoKey) {
        localStorage.setItem(LOCAL_STATE_ENC_KEY, JSON.stringify({ unencrypted_local: appState }));
      } else {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sessionCryptoKey, payloadBytes);
        const env = {
          kdf: "PBKDF2-SHA256",
          cipher: "AES-256-GCM",
          iterations: 210000,
          salt_b64: bytesToB64(sessionSalt),
          nonce_b64: bytesToB64(iv),
          ciphertext_b64: bytesToB64(new Uint8Array(ct))
        };
        localStorage.setItem(LOCAL_STATE_ENC_KEY, JSON.stringify(env));
      }
      if (ind) {
        const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        ind.style.display = "inline-flex";
        ind.textContent = "✓ Saved (AES-GCM) • " + t;
      }
      if (label) showToast(label);
    } catch (_e) {
      if (ind) ind.textContent = "Save warning";
    }
  }

  // --- Date & Task/Subtask Normalization ---
  function todayIsoStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function parseIsoDate(iso) {
    if (!iso || typeof iso !== "string" || iso.length < 10) return null;
    const p = iso.slice(0, 10).split("-").map(Number);
    if (p.length !== 3 || isNaN(p[0]) || isNaN(p[1]) || isNaN(p[2])) return null;
    return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
  }

  function formatIsoDate(dt) {
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const d = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function addDaysIso(iso, deltaDays) {
    const base = parseIsoDate(iso) || parseIsoDate(todayIsoStr());
    base.setDate(base.getDate() + deltaDays);
    return formatIsoDate(base);
  }

  function diffCalendarDays(startIso, endIso) {
    const s = parseIsoDate(startIso);
    const e = parseIsoDate(endIso);
    if (!s || !e) return 0;
    return Math.round((e - s) / 86400000);
  }

  function countWorkDays(startIso, endIso) {
    let s = parseIsoDate(startIso);
    let e = parseIsoDate(endIso);
    if (!s || !e) return 1;
    if (e < s) { const tmp = s; s = e; e = tmp; }
    let count = 0;
    const cur = new Date(s.getTime());
    while (cur <= e) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return Math.max(1, count);
  }

  function normalizeSubtask(st, parentTask) {
    if (!st.owner) st.owner = parentTask ? parentTask.owner : "both";
    if (!st.start_date) st.start_date = parentTask ? parentTask.start_date : todayIsoStr();
    if (!st.end_date || st.end_date < st.start_date) {
      st.end_date = parentTask && parentTask.end_date >= st.start_date ? parentTask.end_date : st.start_date;
    }
    let sp = Number(st.progress_pct);
    if (!Number.isFinite(sp)) {
      sp = st.done ? 100 : 0;
    }
    sp = Math.max(0, Math.min(100, Math.round(sp)));
    st.progress_pct = sp;
    st.done = sp >= 100;
    return st;
  }

  function normalizeSection(sec, allTasks) {
    const secTasks = (allTasks || []).filter(t => t.section_id === sec.id);
    if (!sec.start_date) {
      sec.start_date = secTasks.length
        ? secTasks.reduce((a, t) => (t.start_date < a ? t.start_date : a), secTasks[0].start_date)
        : todayIsoStr();
    }
    if (!sec.end_date) {
      sec.end_date = secTasks.length
        ? secTasks.reduce((a, t) => (t.end_date > a ? t.end_date : a), secTasks[0].end_date)
        : addDaysIso(sec.start_date, 14);
    }
    if (sec.end_date < sec.start_date) sec.end_date = sec.start_date;
    return sec;
  }

  function normalizeTask(t) {
    if (!t.start_date) t.start_date = todayIsoStr();
    if (!t.end_date || t.end_date < t.start_date) t.end_date = t.start_date;
    if (!STATUS_LIST.includes(t.status)) t.status = "Todo";
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
    t.subtasks.forEach(st => normalizeSubtask(st, t));

    if (t.subtasks.length > 0) {
      const autoPct = Math.round(
        t.subtasks.reduce((sum, s) => sum + s.progress_pct, 0) / t.subtasks.length
      );
      t.progress_pct = autoPct;
      if (autoPct >= 100) {
        t.status = "Done";
      } else if (t.status === "Done") {
        t.status = autoPct > 0 ? "Doing" : "Todo";
      } else if (autoPct > 0 && t.status === "Todo") {
        t.status = "Doing";
      }
    } else {
      let pct = Number(t.progress_pct);
      if (!Number.isFinite(pct)) pct = 0;
      pct = Math.max(0, Math.min(100, Math.round(pct)));
      if (t.status === "Done") pct = 100;
      t.progress_pct = pct;
    }

    t.priority = Math.max(1, Math.min(5, Math.round(Number(t.priority) || 3)));
    if (!Array.isArray(t.links)) t.links = [];
    return t;
  }

  function computeTaskMetrics(t, todayIso) {
    normalizeTask(t);
    const pct = t.status === "Done" ? 100 : t.progress_pct;
    const isDone = t.status === "Done" || pct >= 100;
    const isStuck = !isDone && t.status === "Stuck";
    const isOverdue = !isDone && Boolean(t.end_date && t.end_date < todayIso);
    return { pct, isDone, isStuck, isOverdue };
  }

  function computeDerivedHealth(tasksList, todayIso) {
    let stuck = 0;
    let overdue = 0;
    for (const t of tasksList) {
      const m = computeTaskMetrics(t, todayIso);
      if (m.isStuck) stuck++;
      if (m.isOverdue) overdue++;
    }
    if (stuck === 0 && overdue === 0) return { label: "On Track", cls: "health-on-track", stuck, overdue };
    if (stuck >= 2 || overdue >= 2 || (stuck >= 1 && overdue >= 1)) {
      return { label: "Off Track", cls: "health-off-track", stuck, overdue };
    }
    return { label: "At Risk", cls: "health-at-risk", stuck, overdue };
  }

  function getMember(ownerId) {
    const list = (appState && appState.team_members) || [];
    const found = list.find(m => m.id === ownerId);
    if (found) return found;
    return list[0] || { id: "unassigned", name: String(ownerId || "Team"), full_name: String(ownerId || "Team"), initials: "TM", color: "#64748B", bg: "#F1F5F9" };
  }

  function getSection(secId) {
    const list = (appState && appState.sections) || [];
    return list.find(s => s.id === secId) || list[0] || { id: "default", code: "PHASE", title: "General", color: "#475569", bg: "#F1F5F9" };
  }

  function taskMatchesFilters(t) {
    if (ui.phaseFilter !== "ALL" && t.section_id !== ui.phaseFilter) return false;
    if (ui.ownerFilter !== "ALL") {
      if (ui.ownerFilter.startsWith("PLATE_")) {
        const targetId = ui.ownerFilter.slice(6);
        const subMatch = (t.subtasks || []).some(s => s.owner === targetId || s.owner === "both");
        if (t.owner !== targetId && t.owner !== "both" && !subMatch) return false;
      } else {
        const subExact = (t.subtasks || []).some(s => s.owner === ui.ownerFilter);
        if (t.owner !== ui.ownerFilter && !subExact) return false;
      }
    }
    if (ui.searchQuery.trim()) {
      const q = ui.searchQuery.trim().toLowerCase();
      const sec = getSection(t.section_id);
      const mem = getMember(t.owner);
      const subText = (t.subtasks || []).map(s => s.title).join(" ");
      const hay = `${t.title} ${t.deliverable || ""} ${sec.title} ${mem.name} ${subText}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  // --- Timeline Window Builder ---
  function buildTimelineDays(filteredTasks) {
    const todayIso = todayIsoStr();
    let startDt;
    let totalDays;

    if (ui.zoomMode === "FULL") {
      const pool = filteredTasks.length ? filteredTasks : (appState.tasks || []);
      const secs = (appState.sections || []).filter(
        s => ui.phaseFilter === "ALL" || s.id === ui.phaseFilter
      );
      secs.forEach(s => normalizeSection(s, appState.tasks || []));
      let minIso = appState.anchor_start || todayIso;
      let maxIso = appState.target_close || addDaysIso(todayIso, 42);
      const starts = [...pool.map(t => t.start_date), ...secs.map(s => s.start_date)].filter(Boolean);
      const ends = [...pool.map(t => t.end_date), ...secs.map(s => s.end_date)].filter(Boolean);
      if (starts.length) minIso = starts.reduce((a, x) => (x < a ? x : a), starts[0]);
      if (ends.length) maxIso = ends.reduce((a, x) => (x > a ? x : a), ends[0]);
      startDt = parseIsoDate(addDaysIso(minIso, -2 + ui.panOffsetDays));
      const endDt = parseIsoDate(addDaysIso(maxIso, 4 + ui.panOffsetDays));
      totalDays = Math.max(21, Math.min(160, Math.round((endDt - startDt) / 86400000) + 1));
    } else {
      totalDays = ui.zoomMode === "6W" ? 42 : 21;
      startDt = parseIsoDate(addDaysIso(todayIso, -3 + ui.panOffsetDays));
    }

    const days = [];
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(startDt.getTime());
      d.setDate(startDt.getDate() + i);
      const iso = formatIsoDate(d);
      const dow = d.getDay();
      days.push({
        idx: i,
        iso,
        dayNum: d.getDate(),
        monthShort: d.toLocaleDateString("en-US", { month: "short" }),
        weekdayNarrow: ["Su", "M", "T", "W", "Th", "F", "Sa"][dow],
        isToday: iso === todayIso,
        isWeekend: dow === 0 || dow === 6,
        isMonday: dow === 1 || i === 0
      });
    }

    const weeks = [];
    let curWeek = null;
    days.forEach((d, idx) => {
      if (!curWeek || (d.isMonday && idx > 0)) {
        curWeek = { label: `WEEK ${weeks.length + 1} (${d.monthShort} ${d.dayNum})`, span: 0 };
        weeks.push(curWeek);
      }
      curWeek.span++;
    });

    window._launchTimelineDays = days;
    return { days, weeks, totalDays };
  }

  function computeBarGeom(startIso, endIso, days) {
    const total = days.length;
    const winStart = parseIsoDate(days[0].iso);
    const s = parseIsoDate(startIso) || winStart;
    const e = parseIsoDate(endIso) || s;
    const rawStart = Math.round((s - winStart) / 86400000);
    const rawEnd = Math.round((e - winStart) / 86400000);
    const outLeft = rawEnd < 0;
    const outRight = rawStart >= total;
    const clampedStart = Math.max(0, Math.min(total - 1, rawStart));
    const clampedEnd = Math.max(clampedStart, Math.min(total - 1, rawEnd));
    const leftPct = (clampedStart / total) * 100;
    const widthPct = Math.max(100 / total, ((clampedEnd - clampedStart + 1) / total) * 100);
    return { leftPct, widthPct, clampedStart, clampedEnd, outLeft, outRight };
  }

  function resolveBarPalette(task, sec, mem) {
    if (ui.colorBy === "PHASE") {
      return { bg: sec.bg || "#FFEDD5", border: sec.color || "#F05332", text: sec.color || "#F05332" };
    }
    if (ui.colorBy === "STATUS") {
      const st = STATUS_STYLE[task.status] || STATUS_STYLE.Todo;
      return { bg: st.bg, border: st.color, text: st.color };
    }
    return { bg: mem.bg || "rgba(240,83,50,0.12)", border: mem.color || "#F05332", text: mem.color || "#F05332" };
  }
