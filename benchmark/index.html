<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MuniLM XBRL — 67-ACFR Methodology &amp; Step 6 Benchmark Brief</title>
  <link rel="icon" type="image/png" href="./assets/brand/logomark_orange.png" />
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('./assets/fonts/Figtree-VariableFont_wght.ttf') format('truetype');
      font-weight: 300 900;
      font-display: swap;
    }
    :root {
      --muni-orange: #F05332;
      --muni-ink: #141519;
      --muni-muted: #6E7381;
      --muni-pearl: #F3F3F6;
      --muni-border: rgba(20, 21, 25, 0.08);
      --pass-green: #0F9D58;
      --pass-bg: rgba(15, 157, 88, 0.10);
      --warn-amber: #D97706;
      --warn-bg: rgba(217, 119, 6, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--muni-pearl);
      background-image:
        radial-gradient(circle at 18% 90%, rgba(240, 83, 50, 0.11) 0%, transparent 40%),
        radial-gradient(circle at 84% 14%, rgba(96, 165, 250, 0.09) 0%, transparent 38%);
      color: var(--muni-ink);
      min-height: 100vh;
      padding: 32px 22px 60px;
    }
    .shell { max-width: 1100px; margin: 0 auto; }
    .topbar {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px -10px rgba(20,21,25,0.06);
    }
    .topbar img { height: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--muni-border);
      background: #FFF;
      color: var(--muni-ink);
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--muni-orange); color: #FFF; border-color: var(--muni-orange); }
    .auth-gate {
      position: fixed;
      inset: 0;
      background: rgba(243,243,246,0.92);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 20px;
    }
    .auth-gate.hidden { display: none; }
    .auth-card {
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 24px;
      padding: 34px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 22px 50px -12px rgba(20,21,25,0.12);
    }
    .hero {
      background: linear-gradient(125deg, #FFFFFF 58%, rgba(240, 83, 50, 0.09) 100%);
      border: 1px solid var(--muni-border);
      border-radius: 24px;
      padding: 32px 34px;
      margin-bottom: 20px;
    }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.09em; color: var(--muni-orange); text-transform: uppercase; margin-bottom: 8px; }
    .hero h1 { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    .hero p { font-size: 14.5px; color: var(--muni-muted); line-height: 1.6; max-width: 880px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .kpi {
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 18px;
      padding: 18px;
    }
    .kpi-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--muni-muted); margin-bottom: 6px; }
    .kpi-val { font-size: 24px; font-weight: 800; color: var(--muni-ink); margin-bottom: 4px; }
    .kpi-sub { font-size: 12px; color: var(--muni-muted); line-height: 1.4; }
    .card {
      background: #FFF;
      border: 1px solid var(--muni-border);
      border-radius: 20px;
      padding: 24px 26px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 19px; font-weight: 800; margin-bottom: 14px; }
    .layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 14px; }
    .layer-box { border: 1px solid var(--muni-border); border-radius: 14px; padding: 16px; background: #FAFAFC; }
    .layer-num { font-size: 11px; font-weight: 800; color: var(--muni-orange); text-transform: uppercase; margin-bottom: 4px; }
    .layer-box h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .layer-box p { font-size: 12.8px; color: var(--muni-muted); line-height: 1.5; }
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--muni-border); text-align: left; }
    th { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muni-muted); background: #F8F9FB; }
    .pill-pass { background: var(--pass-bg); color: var(--pass-green); font-weight: 800; font-size: 11px; padding: 3px 9px; border-radius: 999px; }
    .pill-part { background: var(--warn-bg); color: var(--warn-amber); font-weight: 800; font-size: 11px; padding: 3px 9px; border-radius: 999px; }
    ul.notes { padding-left: 18px; display: grid; gap: 8px; font-size: 13.5px; color: var(--muni-ink); line-height: 1.55; }
  </style>
</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <img src="./assets/brand/logo_horizontal_black_orange.png" alt="MuniLM" style="height:36px; margin-bottom:16px;" />
      <div class="eyebrow">MuniLM Encrypted Demo Vault</div>
      <h2 style="font-size:22px; font-weight:800; margin-bottom:8px;">Unlock Benchmark Brief</h2>
      <p style="font-size:13.5px; color:var(--muni-muted); line-height:1.5; margin-bottom:18px;">
        Enter your MuniLM invite key once to unlock the 67-ACFR methodology &amp; Step 6 blind-holdout report plus all 5 city workstations.
      </p>
      <form id="briefForm" style="display:flex; gap:8px;">
        <input id="briefKeyInput" type="password" placeholder="Enter MuniLM invite key..." style="flex:1; padding:10px 14px; border-radius:12px; border:1px solid var(--muni-border); font-family:inherit; font-size:13.5px;" />
        <button type="submit" class="btn btn-primary">Unlock &rarr;</button>
      </form>
      <div id="briefAuthMsg" style="font-size:12.5px; color:#DC2626; margin-top:10px; min-height:18px;"></div>
    </div>
  </div>

  <div class="shell">
    <header class="topbar">
      <a href="../" style="display:flex; align-items:center; text-decoration:none;">
        <img src="./assets/brand/logo_horizontal_black_orange.png" alt="MuniLM" />
      </a>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <a class="btn" href="../">All Prototypes</a>
        <a class="btn" href="../acfr-extraction/">&larr; ACFR Extraction Hub</a>
        <span style="font-size:11.5px; font-weight:800; background:var(--pass-bg); color:var(--pass-green); padding:6px 12px; border-radius:999px;">&check; Vault Unlocked</span>
        <button class="btn" onclick="lockVault()">Lock Vault</button>
      </div>
    </header>
    <main id="briefMain"></main>
  </div>

  <script>
  (function() {
    "use strict";
    const VAULT_STORAGE_KEY = "munilm_team_vault_key_v1";
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
    function b64ToBytes(b64) { const b = atob(b64), o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i]=b.charCodeAt(i); return o; }
    async function decryptEnvelope(env, pass) {
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey("raw", enc.encode(pass.trim()), {name:"PBKDF2"}, false, ["deriveKey"]);
      const ak = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBytes(env.salt_b64), iterations:env.iterations||210000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(env.nonce_b64)}, ak, b64ToBytes(env.ciphertext_b64));
      return JSON.parse(new TextDecoder("utf-8").decode(pt));
    }
    function renderBrief(data) {
      const main = document.getElementById("briefMain");
      const kpis = (data.kpis||[]).map(k => `<div class="kpi"><div class="kpi-lbl">${esc(k.label)}</div><div class="kpi-val">${esc(k.val)}</div><div class="kpi-sub">${esc(k.sub)}</div></div>`).join("");
      const layers = (data.layers||[]).map(l => `<div class="layer-box"><div class="layer-num">${esc(l.num)}</div><h3>${esc(l.name)}</h3><p>${esc(l.detail)}</p></div>`).join("");
      const rubricRows = (data.step6_rubric||[]).map(r => {
        const cls = String(r[5]).startsWith("PASS") ? "pill-pass" : "pill-part";
        return `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td><strong>${esc(r[4])}</strong></td><td><span class="${cls}">${esc(r[5])}</span></td></tr>`;
      }).join("");
      const grandRows = (data.grand_table||[]).map(r => `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td><strong>${esc(r[3])}</strong></td><td><strong>${esc(r[4])}</strong></td></tr>`).join("");
      const mlRows = (data.ml_table||[]).map(r => `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td><td><strong>${esc(r[2])}</strong></td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td></tr>`).join("");
      const notes = (data.notes||[]).map(n => `<li>${esc(n)}</li>`).join("");
      main.innerHTML = `
        <section class="hero">
          <div class="eyebrow">${esc(data.eyebrow)}</div>
          <h1>${esc(data.title)}</h1>
          <p>${esc(data.subtitle)}</p>
        </section>
        <section class="kpi-grid">${kpis}</section>
        <section class="card">
          <h2>1. Four-Layer Hybrid ACFR-to-XBRL Architecture</h2>
          <div class="layers">${layers}</div>
        </section>
        <section class="card">
          <h2>2. Pre-Registered Step 6 Blind Holdout Exam (30 Unseen Municipal ACFRs, Frozen Commit 06995eb)</h2>
          <div class="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Criterion</th><th>Pass Bar</th><th>Partial Floor</th><th>Verified Blind Holdout Result</th><th>Outcome</th></tr></thead>
              <tbody>${rubricRows}</tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>3. Complete 67-ACFR Grand Corpus Scorecard</h2>
          <div class="tbl-wrap">
            <table>
              <thead><tr><th>Verification Gate</th><th>train_dev (27)</th><th>dev_val (10)</th><th>blind_holdout_v2 (30 Unseen)</th><th>67-ACFR Grand Total</th></tr></thead>
              <tbody>${grandRows}</tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>4. Neural Concept Mapping Progression on Unseen XBRL-US Lockbox (11 Governments, 1,289 Rows)</h2>
          <div class="tbl-wrap">
            <table>
              <thead><tr><th>Milestone</th><th>Model Architecture</th><th>ZONE1 Precision</th><th>Pure Neural Leaf</th><th>Confidently Wrong</th><th>Auto Coverage</th><th>ZONE3 Top-5 Recall</th></tr></thead>
              <tbody>${mlRows}</tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>5. Key Empirical &amp; Governance Notes</h2>
          <ul class="notes">${notes}</ul>
        </section>
      `;
    }
    async function tryUnlock(passkey, silent) {
      if (!passkey) return false;
      try {
        const env = JSON.parse(document.getElementById("encryptedBundlePayload").textContent);
        const data = env.unencrypted_brief ? env.unencrypted_brief : await decryptEnvelope(env, passkey);
        localStorage.setItem(VAULT_STORAGE_KEY, passkey.trim());
        document.getElementById("authGate").classList.add("hidden");
        renderBrief(data);
        return true;
      } catch (_e) {
        if (!silent) document.getElementById("briefAuthMsg").textContent = "Invalid invite key. Please check your MuniLM demo invite link.";
        return false;
      }
    }
    window.lockVault = function() { localStorage.removeItem(VAULT_STORAGE_KEY); location.reload(); };
    (async function init() {
      const hm = (window.location.hash || "").match(/(?:^|[&#])key=([^&]+)/);
      let hk = null;
      if (hm) {
        try { hk = decodeURIComponent(hm[1]).trim(); } catch(_e) { hk = String(hm[1]||"").trim(); }
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }
      const env = JSON.parse(document.getElementById("encryptedBundlePayload").textContent);
      if (env && env.unencrypted_brief) {
        document.getElementById("authGate").classList.add("hidden");
        renderBrief(env.unencrypted_brief);
        return;
      }
      if (hk && (await tryUnlock(hk, false))) return;
      const saved = localStorage.getItem(VAULT_STORAGE_KEY);
      if (saved && (await tryUnlock(saved, true))) return;
      document.getElementById("briefForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        await tryUnlock(document.getElementById("briefKeyInput").value, false);
      });
    })();
  })();
  </script>
